<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Payment canceled — Vanssay</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
<style>
  :root { --text:#18181b; --muted:#71717a; --accent:#2563eb; --border:#e4e4e7; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Inter',sans-serif; background:#fafafa; color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:#fff; border:1px solid var(--border); border-radius:18px; padding:48px 44px; max-width:460px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.06); }
  .emoji { font-size:44px; }
  h1 { font-size:24px; margin:18px 0 10px; letter-spacing:-.02em; }
  p { color:var(--muted); font-size:14.5px; line-height:1.65; }
  .btn { display:inline-block; margin-top:26px; padding:12px 22px; border-radius:12px; background:var(--accent); color:#fff; font-weight:600; font-size:14px; text-decoration:none; }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">🙅</div>
    <h1>Payment canceled</h1>
    <p>No charge was made. You can keep using Vanssay on the free plan, and upgrade anytime from the plugin or your account page.</p>
    <a class="btn" href="../../index.html#pricing">Back to pricing</a>
  </div>
</body>
</html>
