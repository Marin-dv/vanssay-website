<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin | Vanssay</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" href="/favicon-48.png" sizes="48x48" />
<link rel="apple-touch-icon" href="/favicon-180.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --bg:#f7f7f8; --surface:#fff; --surface-2:#f4f4f5; --border:#e6e6e9; --text:#18181b;
      --text-2:#52525b; --muted:#a1a1aa; --accent:#4f46e5; --accent-soft:#eef0fe; --pro:#6d5cf0;
      --ink:#141417; --error:#dc2626; --green:#16a34a; --amber:#d97706;
      --shadow:0 1px 2px rgba(24,24,27,.05); --shadow-md:0 10px 34px rgba(24,24,27,.09);
    }
    body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); line-height:1.55; min-height:100vh; -webkit-font-smoothing:antialiased; font-size:14px; }
    a { color:var(--accent); text-decoration:none; }
    button { font:inherit; cursor:pointer; }
    .hidden { display:none !important; }

    /* ── Auth gate ── */
    .gate { max-width:400px; margin:0 auto; padding:80px 24px; }
    .gate h1 { font-size:26px; font-weight:900; letter-spacing:-.02em; margin-bottom:6px; }
    .gate p { color:var(--text-2); margin-bottom:22px; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow-md); }
    .gate .card { padding:26px; }
    label { display:block; font-size:12.5px; font-weight:600; margin:14px 0 5px; }
    input, select { width:100%; padding:10px 13px; border:1px solid var(--border); border-radius:9px; font:inherit; font-size:14px; outline:none; background:#fff; }
    input:focus, select:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:10px 16px; border-radius:10px; font-size:13.5px; font-weight:700; border:1px solid transparent; background:var(--surface-2); color:var(--text); }
    .btn:hover { filter:brightness(.98); }
    .btn-blue { background:var(--accent); color:#fff; }
    .btn-line { background:#fff; border-color:var(--border); }
    .btn-danger { background:var(--error); color:#fff; }
    .btn-full { width:100%; margin-top:18px; }
    .btn-sm { padding:7px 12px; font-size:12.5px; }
    .err { background:#fdecec; color:var(--error); border-radius:9px; padding:9px 13px; font-size:12.5px; margin-top:12px; display:none; }
    .ok { background:#e9f7ef; color:var(--green); border-radius:9px; padding:9px 13px; font-size:12.5px; margin-top:12px; display:none; }

    /* ── Shell ── */
    .shell { display:none; min-height:100vh; grid-template-columns:236px 1fr; }
    aside { background:var(--surface); border-right:1px solid var(--border); padding:20px 14px; position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:2px; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:15.5px; letter-spacing:-.01em; padding:2px 8px 16px; }
    .brand .logo { width:28px; height:28px; border-radius:8px; background:var(--ink); display:flex; align-items:center; justify-content:center; flex:none; }
    .navlink { display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:9px; color:var(--text-2); font-weight:600; font-size:13.5px; border:none; background:none; width:100%; text-align:left; position:relative; transition:background .12s,color .12s; }
    .navlink:hover { background:var(--surface-2); color:var(--text); }
    .navlink.active { background:var(--accent-soft); color:var(--accent); }
    .navlink.active::before { content:""; position:absolute; left:-14px; top:8px; bottom:8px; width:3px; border-radius:0 3px 3px 0; background:var(--accent); }
    .navlink .ic { width:18px; text-align:center; font-size:14px; display:inline-flex; align-items:center; justify-content:center; }
    .navlink .ic svg { width:16px; height:16px; }
    .navsep { font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:700; margin:16px 11px 5px; }
    .aside-foot { margin-top:auto; font-size:12px; color:var(--muted); padding:12px 8px 0; border-top:1px solid var(--border); }
    main { padding:30px 34px 70px; max-width:1240px; }
    .page-head { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:22px; gap:16px; flex-wrap:wrap; }
    h2 { font-size:22px; font-weight:900; letter-spacing:-.02em; }
    .page-head p { color:var(--text-2); font-size:13px; }
    .prodbar { display:inline-flex; background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:3px; gap:2px; }
    .prodbar .pb { border:0; background:none; padding:6px 13px; border-radius:7px; font:inherit; font-size:13px; font-weight:600; color:var(--text-2); cursor:pointer; }
    .prodbar .pb.on { background:var(--surface); color:var(--accent); box-shadow:0 1px 2px rgba(0,0,0,.08); }

    /* ── KPI cards ── */
    .kpis { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px; margin-bottom:24px; }
    .kpi { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 18px; box-shadow:var(--shadow); }
    .kpi .k-label { font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.03em; }
    .kpi .k-val { font-size:26px; font-weight:900; letter-spacing:-.02em; margin-top:4px; }
    .kpi .k-sub { font-size:12px; color:var(--text-2); margin-top:2px; }
    .kpi.hero { background:var(--ink); color:#fff; border:none; }
    .kpi.hero .k-label, .kpi.hero .k-sub { color:rgba(255,255,255,.6); }

    .grid-2 { display:grid; grid-template-columns:1.4fr 1fr; gap:16px; }
    .grid-eq { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    @media (max-width:900px){ .grid-2, .grid-eq { grid-template-columns:1fr; } .shell { grid-template-columns:1fr; } aside { position:static; height:auto; flex-direction:row; flex-wrap:wrap; } }
    .panel { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px 20px; box-shadow:var(--shadow); }
    .panel h3 { font-size:14px; font-weight:800; margin-bottom:14px; }
    .panel h3 .open { float:right; font-size:12px; font-weight:600; }
    .prodgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; margin-bottom:24px; }
    .prodgrid .mrr { font-size:24px; font-weight:900; letter-spacing:-.02em; margin:2px 0 10px; }
    .prodgrid .mrr small { font-size:12px; color:var(--muted); font-weight:600; }

    /* ── Bar chart ── */
    .chart { display:flex; align-items:flex-end; gap:6px; height:140px; }
    .bar { flex:1; background:var(--accent); border-radius:5px 5px 0 0; min-height:3px; position:relative; opacity:.85; }
    .bar:hover { opacity:1; }
    .bar:hover::after { content:attr(data-tip); position:absolute; bottom:100%; left:50%; transform:translateX(-50%); background:#18181b; color:#fff; font-size:11px; padding:4px 8px; border-radius:6px; white-space:nowrap; margin-bottom:5px; z-index:5; }
    .chart-x { display:flex; gap:6px; margin-top:6px; }
    .chart-x span { flex:1; text-align:center; font-size:10px; color:var(--muted); overflow:hidden; }

    /* ── Tables ── */
    .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
    .toolbar input, .toolbar select { width:auto; }
    .toolbar input.search { min-width:240px; }
    .tablewrap { background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; box-shadow:var(--shadow); }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:700; padding:12px 14px; border-bottom:1px solid var(--border); background:#fafafa; }
    td { padding:11px 14px; border-bottom:1px solid var(--border); vertical-align:middle; }
    tr:last-child td { border-bottom:none; }
    tbody tr.clickable:hover { background:#f8fafc; cursor:pointer; }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; color:var(--text-2); }
    .truncate { max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .right { text-align:right; }
    .empty { padding:40px; text-align:center; color:var(--muted); }
    .note { font-size:12px; color:var(--muted); padding:8px 2px; }

    .badge { display:inline-flex; padding:2px 10px; border-radius:99px; font-size:11.5px; font-weight:800; white-space:nowrap; }
    .b-free { background:var(--surface-2); color:var(--text-2); } .b-pro { background:var(--accent-soft); color:var(--pro); } .b-ultra { background:var(--ink); color:#fff; }
    .b-starter { background:#fdecf3; color:#e0457b; }
    .b-active { background:#e9f7ef; color:var(--green); } .b-canceled { background:#fdecec; color:var(--error); } .b-other { background:var(--surface-2); color:var(--text-2); }
    .b-framer { background:#eef1f4; color:#111318; } .b-webflow { background:#e6f0ff; color:#155cc4; }
    .badges { display:flex; gap:5px; flex-wrap:wrap; }
    .pager { display:flex; align-items:center; gap:12px; justify-content:flex-end; margin-top:14px; font-size:13px; color:var(--text-2); }
    .meter { height:7px; border-radius:99px; background:var(--surface-2); overflow:hidden; }
    .meter span { display:block; height:100%; background:var(--accent); }

    /* ── Modal ── */
    .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; justify-content:flex-end; z-index:50; }
    .modal { width:560px; max-width:100%; background:var(--bg); height:100%; overflow-y:auto; padding:26px 28px; box-shadow:-10px 0 40px rgba(0,0,0,.2); animation:slidein .18s ease; }
    @keyframes slidein { from { transform:translateX(30px); opacity:.6; } to { transform:none; opacity:1; } }
    .modal-head { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:18px; }
    .modal-head h3 { font-size:18px; font-weight:900; word-break:break-all; }
    .x { background:none; border:none; font-size:22px; color:var(--muted); line-height:1; }
    .modal .card { padding:18px; margin-bottom:14px; }
    .field-row { display:flex; gap:10px; align-items:flex-end; }
    .field-row > div { flex:1; }
    .kv { display:flex; justify-content:space-between; gap:12px; padding:5px 0; font-size:13px; border-bottom:1px dashed var(--border); }
    .kv:last-child { border-bottom:none; }
    .kv span:first-child { color:var(--text-2); }
    .sec-title { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:700; margin:18px 0 8px; }
    .planrow { display:grid; grid-template-columns:110px 1fr auto; gap:10px; align-items:center; margin-bottom:8px; }
    .planrow .pname { font-weight:700; font-size:13px; }
    .ministat { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .ministat .kpi { padding:12px 14px; } .ministat .k-val { font-size:20px; }
    .muted-sm { font-weight:600; font-size:11.5px; color:var(--text-2); }
    .muted-sm .good { color:#16a34a; } .muted-sm .bad { color:#dc2626; }
  </style>
</head>
<body>

<!-- ── Login gate ── -->
<div class="gate" id="gate">
  <h1>Admin</h1>
  <p>Sign in with an admin account.</p>
  <div class="card">
    <label>Email</label>
    <input id="g-email" type="email" placeholder="you@vanssay.net" autocomplete="email" />
    <label style="display:flex;justify-content:space-between">Password <a id="g-toggle" style="cursor:pointer">Show</a></label>
    <input id="g-pass" type="password" placeholder="Your password" autocomplete="current-password" />
    <div class="err" id="g-err"></div>
    <button class="btn btn-blue btn-full" id="g-btn">Sign in</button>
  </div>
</div>

<!-- ── App shell ── -->
<div class="shell" id="shell">
  <aside>
    <div class="brand">
      <span class="logo"><svg width="16" height="16" viewBox="0 0 40 40"><path d="M6,4H15L27,36H18Z" fill="#fff"/><path d="M34,4H25L13,36H22Z" fill="#8b8bff"/></svg></span>
      Vanssay <span style="color:var(--muted);font-weight:600">Admin</span>
    </div>
    <div class="navsep">Workspace</div>
    <button class="navlink active" data-tab="overview"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg></span> Overview</button>
    <button class="navlink" data-tab="users"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg></span> Users</button>
    <button class="navlink" data-tab="subs"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg></span> Subscriptions</button>
    <button class="navlink" data-tab="expenses"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1v22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></span> Expenses</button>
    <div class="navsep">Plugins</div>
    <div id="prod-nav"></div>
    <div class="aside-foot">
      <div id="admin-email" style="margin-bottom:8px;color:var(--text-2);font-weight:600"></div>
      <button class="btn btn-line btn-sm" id="signout">Sign out</button>
    </div>
  </aside>

  <main id="view"></main>
</div>

<div id="modal-root"></div>

<script>
const API = localStorage.getItem("vanssay.apiBase") || "https://api.vanssay.net";
const TKEY = "vanssay.token";

/* ── Product registry ─────────────────────────────────────────────────────────
   One entry per plugin. `base` = the plugin backend's path prefix on the API
   host ("" = the Accounts/Reviews service itself). Adding a future plugin =
   add a row here + (if it has its own backend) it gets a sidebar page free. */
const PRODUCTS = [
  { key: "reviews",     label: "Reviews",     icon: "⭐", base: "",             cache: true  },
  { key: "geoblock",    label: "Bouncer",     icon: "🛡️", base: "/geoblock",    cache: true  },
  { key: "router",      label: "Router",      icon: "🧭", base: "/router",      cache: true  },
  { key: "instagram",   label: "Instagram",   icon: "📸", base: "/instagram",   cache: false },
  { key: "maintenance", label: "Maintenance", icon: "🚧", base: "/maintenance", cache: false },
];
const PROD = Object.fromEntries(PRODUCTS.map((p) => [p.key, p]));

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));
const fmt = (n) => Number(n || 0).toLocaleString();
const money = (n) => "$" + Number(n || 0).toLocaleString();
const date = (d) => d ? new Date(d).toLocaleDateString(undefined, { year:"numeric", month:"short", day:"numeric" }) : "-";
const dt = (d) => d ? new Date(d).toLocaleString(undefined, { month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" }) : "-";
// Apify costs are tiny (fractions of a cent → a few $); show enough precision to be useful.
const usd = (n) => { n = Number(n || 0); return "$" + (n >= 1 ? n.toFixed(2) : n.toFixed(4)); };
const planBadge = (p) => { p = p || "free"; return `<span class="badge b-${esc(p)}">${esc(p[0].toUpperCase()+p.slice(1))}</span>`; };
// Signup platform (host): Framer or Webflow.
const platformBadge = (p) => { const k = p === "webflow" ? "webflow" : "framer"; const lbl = k === "webflow" ? "Webflow" : "Framer"; return `<span class="badge b-${k}">${k==="webflow"?"◇":"◆"} ${lbl}</span>`; };
const statusBadge = (s) => { const k = s==="active"||s==="trialing"?"b-active":s==="canceled"?"b-canceled":"b-other"; return `<span class="badge ${k}">${esc(s||"-")}</span>`; };
const flag = (cc) => (cc && cc.length === 2 ? cc.toUpperCase().replace(/./g, (c) => String.fromCodePoint(127397 + c.charCodeAt(0))) : "🏳️");
const shortId = (id) => `<span class="mono" title="${esc(id)}">${esc(String(id||"").slice(0,8))}…</span>`;
// Owner cell: prefer the email (resolved from Accounts), fall back to the opaque id.
const owner = (s) => s.email ? `<span title="${esc(s.userId)}">${esc(s.email)}</span>` : shortId(s.userId);
// Website cell: the domain captured from the published site's /check calls.
const hostOf = (u) => { try { return new URL(u).host; } catch { return String(u || ""); } };
const website = (s) => s.domain ? `<a class="mono" href="${esc(s.domain)}" target="_blank" rel="noopener">${esc(hostOf(s.domain))}</a>` : "-";
const val = (r) => (r && r.status === "fulfilled" ? r.value : null);
const why = (r) => (r && r.status === "rejected" ? (r.reason && r.reason.message) || "request failed" : "");
const unavailable = (label, r) => `<div class="empty">${esc(label)} unavailable, ${esc(why(r) || "no data")}</div>`;

async function api(path, opts) {
  opts = opts || {}; // guard: null must not crash on opts.body
  const headers = { ...(opts.body ? { "Content-Type": "application/json" } : {}) };
  const t = localStorage.getItem(TKEY);
  if (t) headers.Authorization = "Bearer " + t;
  const res = await fetch(API + path, { method: opts.method || "GET", headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}
// Identity + billing (users, subs, plans, revenue) live in the central Accounts
// service, product-scoped via ?product=. Domain data lives in each plugin
// backend at <base>/admin/….
const acct = (suffix, opts, prod) => {
  const sep = suffix.includes("?") ? "&" : "?";
  const scoped = prod && prod !== "reviews" ? suffix + sep + "product=" + prod : suffix;
  return api("/admin" + scoped, opts);
};

/* ── Auth gate ── */
const showErr = (id, m) => { const e = $(id); e.textContent = m; e.style.display = m ? "block" : "none"; };
$("g-toggle").onclick = () => { const p = $("g-pass"); p.type = p.type === "password" ? "text" : "password"; $("g-toggle").textContent = p.type === "password" ? "Show" : "Hide"; };
$("g-btn").onclick = doLogin;
$("g-pass").addEventListener("keydown", (e) => e.key === "Enter" && doLogin());
async function doLogin() {
  showErr("g-err", "");
  try {
    const r = await api("/auth/login", { method: "POST", body: { email: $("g-email").value.trim(), password: $("g-pass").value } });
    localStorage.setItem(TKEY, r.token);
    await boot();
  } catch (e) { showErr("g-err", e.message); }
}
$("signout").onclick = () => { localStorage.removeItem(TKEY); location.reload(); };

async function boot() {
  if (!localStorage.getItem(TKEY)) { $("gate").classList.remove("hidden"); $("shell").style.display = "none"; return; }
  try {
    const me = await api("/admin/check");
    $("gate").classList.add("hidden");
    $("shell").style.display = "grid";
    $("admin-email").textContent = me.email;
    switchTab("overview");
  } catch (e) {
    $("shell").style.display = "none";
    $("gate").classList.remove("hidden");
    showErr("g-err", e.message.includes("Admin") ? "This account doesn't have admin access." : e.message);
  }
}

/* ── Navigation ── */
$("prod-nav").innerHTML = PRODUCTS.map((p) =>
  `<button class="navlink" data-tab="prod:${p.key}"><span class="ic">${p.icon}</span> ${esc(p.label)}</button>`).join("");
let curTab = "overview";
document.querySelectorAll(".navlink").forEach((b) => b.onclick = () => switchTab(b.dataset.tab));
function switchTab(tab) {
  curTab = tab;
  document.querySelectorAll(".navlink").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
  $("view").innerHTML = `<div class="empty">Loading…</div>`;
  if (tab.startsWith("prod:")) return renderProduct(tab.slice(5));
  ({ overview: renderOverview, users: renderUsers, subs: renderSubs, expenses: renderExpenses }[tab])();
}

/* ── Shared pieces ── */
function barChart(items) { // [{v, tip, label}]
  const max = Math.max(1, ...items.map((i) => i.v));
  return `<div class="chart">${items.map((i) => `<div class="bar" style="height:${Math.round((i.v/max)*100)}%" data-tip="${esc(i.tip)}"></div>`).join("")}</div>
    <div class="chart-x">${items.map((i) => `<span>${esc(i.label)}</span>`).join("")}</div>`;
}
function planRow(label, n, total) {
  const pct = total ? Math.round((n/total)*100) : 0;
  return `<div style="margin-bottom:10px"><div class="kv" style="border:none;padding-bottom:3px"><span>${esc(label)}</span><strong>${fmt(n)} · ${pct}%</strong></div>
    <div class="meter"><span style="width:${pct}%"></span></div></div>`;
}
function planSplitPanel(bill) {
  if (!bill) return "";
  const t = bill.users.total;
  return `<div class="panel"><h3>Plan distribution</h3>
    ${planRow("Free", bill.plans.free, t)}${planRow("Pro", bill.plans.pro, t)}${planRow("Ultra", bill.plans.ultra, t)}

/* ── Users, one global account list ──
   Shows each account, where it signed up (Framer / Webflow) and which plugins it
   is actively using. Reviews-specific numbers (views, businesses) live on the
   Reviews page now, not here. */
let usersState = { search: "", source: "", page: 1, pageSize: 25 };
async function renderUsers() {
  $("view").innerHTML = `
    <div class="page-head"><div><h2>Users</h2><p>Every account, where it signed up and which plugins it actively uses. Click a row for full detail & overrides.</p></div></div>
    <div class="toolbar">
      <input class="search" id="u-search" placeholder="Search by email…" value="${esc(usersState.search)}" />
      <select id="u-source">
        <option value="">All platforms</option>
        <option value="framer" ${usersState.source==="framer"?"selected":""}>Framer</option>
        <option value="webflow" ${usersState.source==="webflow"?"selected":""}>Webflow</option>
      </select>
      <button class="btn btn-line btn-sm" id="u-refresh">Refresh</button>
    </div>
    <div class="tablewrap" id="u-table"><div class="empty">Loading…</div></div>
    <div class="pager" id="u-pager"></div>`;
  let timer;
  $("u-search").oninput = (e) => { clearTimeout(timer); timer = setTimeout(() => { usersState.search = e.target.value.trim(); usersState.page = 1; loadUsers(); }, 300); };
  $("u-source").onchange = (e) => { usersState.source = e.target.value; usersState.page = 1; loadUsers(); };
  $("u-refresh").onclick = loadUsers;
  loadUsers();
}
async function loadUsers() {
  const wrap = $("u-table");
  const qs = new URLSearchParams({ page: usersState.page, pageSize: usersState.pageSize });
  if (usersState.search) qs.set("search", usersState.search);
  if (usersState.source) qs.set("source", usersState.source);
  // Same page of the same (global) user list, once per product → merge plans by id.
  // In parallel, pull each plugin's domain owners so we can flag *free* users who
  // are still actively using a plugin (e.g. a free Bouncer site). Reviews' domain
  // activity comes back in its own users payload (businesses/views); the other
  // plugins expose owners via their own backend's /admin/sites (site.userId is the
  // shared Accounts user id).
  const [rs, siteRs] = await Promise.all([
    Promise.allSettled(PRODUCTS.map((p) => acct("/users?" + qs, null, p.key))),
    Promise.allSettled(PRODUCTS.map((p) => (p.base ? api(p.base + "/admin/sites") : Promise.resolve(null)))),
  ]);
  const base = val(rs[0]);
  if (!base) { wrap.innerHTML = unavailable("Users", rs[0]); $("u-pager").innerHTML = ""; return; }
  const planOf = {}, rowOf = {}, activeIds = {};
  PRODUCTS.forEach((p, i) => { const d = val(rs[i]); planOf[p.key] = new Map((d ? d.users : []).map((u) => [u.id, u.plan]));
    rowOf[p.key] = new Map((d ? d.users : []).map((u) => [u.id, u]));
    const sd = val(siteRs[i]); activeIds[p.key] = new Set(sd && sd.sites ? sd.sites.map((s) => s.userId).filter(Boolean) : []); });

  // "Actively using" = paid on that plugin, has a domain config there, or
  // (reviews) has businesses / views.
  const usesPlugin = (u, key) => {
    const pl = planOf[key].get(u.id) || "free";
    if (pl !== "free") return true;
    if (key === "reviews") { const r = rowOf.reviews.get(u.id) || u; return (r.businesses || 0) > 0 || (r.viewsThisMonth || 0) > 0; }
    return activeIds[key] ? activeIds[key].has(u.id) : false;
  };

  if (!base.users.length) { wrap.innerHTML = `<div class="empty">No users found.</div>`; $("u-pager").innerHTML = ""; return; }
  wrap.innerHTML = `<table><thead><tr>
      <th>Email</th><th>Platform</th><th>Actively using</th><th>Joined</th>
    </tr></thead><tbody>${base.users.map((u) => {
      const badges = PRODUCTS.filter((p) => usesPlugin(u, p.key)).map((p) => {
        const pl = planOf[p.key].get(u.id) || "free";
        return `<span class="badge b-${pl==="free"?"active":pl}" title="${esc(p.label)} · ${pl}">${p.icon} ${esc(p.label)}${pl!=="free"?" · "+pl[0].toUpperCase()+pl.slice(1):""}</span>`;
      }).join("") || `<span class="note" style="padding:0">Not active yet</span>`;
      return `<tr class="clickable" data-id="${u.id}">
        <td>${esc(u.email)}</td>
        <td>${platformBadge(u.platform)}</td>
        <td><div class="badges">${badges}</div></td>
        <td>${date(u.createdAt)}</td>
      </tr>`;
    }).join("")}</tbody></table>`;
  wrap.querySelectorAll("tr.clickable").forEach((r) => r.onclick = () => openUser(r.dataset.id));
  const pages = Math.max(1, Math.ceil(base.total / base.pageSize));
  $("u-pager").innerHTML = `<span>${base.total} user(s) · page ${base.page}/${pages}</span>
    <button class="btn btn-line btn-sm" ${base.page<=1?"disabled":""} id="u-prev">← Prev</button>
    <button class="btn btn-line btn-sm" ${base.page>=pages?"disabled":""} id="u-next">Next →</button>`;
  if ($("u-prev")) $("u-prev").onclick = () => { usersState.page--; loadUsers(); };
  if ($("u-next")) $("u-next").onclick = () => { usersState.page++; loadUsers(); };
}

/* ── Expenses, Apify scraping costs (Trustpilot + Google) ── */
async function renderExpenses() {
  $("view").innerHTML = `
    <div class="page-head"><div><h2>Expenses</h2><p>Everything we pay Apify to scrape, across every plugin. Cache misses only: a cached widget load is free.</p></div></div>
    <div id="ex"><div class="empty">Loading…</div></div>`;

  // Reviews reads Apify's own settled cost per run; Instagram computes it from
  // the per-item price (its scrape uses the sync endpoint, which never returns
  // the run object). Both are shown, and the estimate is labelled as one.
  const rs = await Promise.allSettled([api("/admin/expenses"), api("/instagram/admin/expenses")]);
  const [rev, ig] = rs.map(val);
  if (!rev && !ig) { $("ex").innerHTML = `<div class="empty">Couldn't load: ${esc(why(rs[0]) || "no data")}</div>`; return; }

  const bp = Object.fromEntries(((rev && rev.month.byPlatform) || []).map((x) => [x.platform, x]));
  const tp = bp.trustpilot || { cost:0, items:0, requests:0 };
  const gg = bp.google || { cost:0, items:0, requests:0 };
  const ba = Object.fromEntries(((ig && ig.month.byActor) || []).map((x) => [x.actor, x]));
  const igProf = ba.profile || { cost:0, items:0, requests:0 };
  const igPost = ba.post || { cost:0, items:0, requests:0 };

  const revMonth = rev ? rev.month.total : 0;
  const igMonth = ig ? ig.month.total : 0;
  const monthTotal = revMonth + igMonth;
  const monthReq = tp.requests + gg.requests + igProf.requests + igPost.requests;
  const allTime = (rev ? rev.allTime.cost : 0) + (ig ? ig.allTime.cost : 0);
  const allReq = (rev ? rev.allTime.requests : 0) + (ig ? ig.allTime.requests : 0);

  // One 12-month series across both backends, keyed by month.
  const series = new Map();
  const addMonths = (list, key) => (list || []).forEach((m) => {
    const row = series.get(m.month) || { month: m.month, reviews: 0, instagram: 0 };
    row[key] += m.total; series.set(m.month, row);
  });
  addMonths(rev && rev.months, "reviews");
  addMonths(ig && ig.months, "instagram");
  const months = [...series.values()].sort((a, b) => a.month.localeCompare(b.month));

  const src = (k) => ({
    trustpilot: `<span class="badge b-pro">⭐ Trustpilot</span>`,
    google: `<span class="badge b-active">🔵 Google</span>`,
    profile: `<span class="badge b-starter">📸 IG profile</span>`,
    post: `<span class="badge b-starter">📸 IG post</span>`,
  }[k] || esc(k));

/* Cache panel (shared) */
function cachePanel(d, r, p, label) {
  if (!d) return `<div class="panel">${unavailable("Cache", r)}</div>`;
  return `<div class="panel" style="max-width:520px">
    <h3>${esc(label)}</h3>
    <div class="kpis" style="margin-bottom:10px">

    </div>
    <div class="ok" id="c-ok"></div><div class="err" id="c-err"></div>
    <div style="display:flex;gap:8px;margin-top:6px">
      <button class="btn btn-line btn-sm" id="c-expired">Purge expired (${fmt(d.expired)})</button>
      <button class="btn btn-danger btn-sm" id="c-all">Purge ALL</button>
    </div>
  </div>`;
}
function bindCache(p) {
  const purge = async (all) => {
    try { const r = await api(p.base + "/admin/cache/purge" + (all?"?all=1":""), { method:"POST" });
      $("c-ok").textContent = `Deleted ${r.deleted} entr${r.deleted===1?"y":"ies"}.`; $("c-ok").style.display = "block";
      setTimeout(() => switchTab("prod:" + p.key), 900); }
    catch(e){ $("c-err").textContent = e.message; $("c-err").style.display = "block"; }
  };
  if ($("c-expired")) $("c-expired").onclick = () => purge(false);
  if ($("c-all")) $("c-all").onclick = () => { if (confirm("Delete the entire cache?")) purge(true); };
}

let pagesSort = "poweredClicks";

async function loadReviewsUsers() {
  const wrap = $("rv-utable"); if (!wrap) return;
  const qs = new URLSearchParams({ page: reviewsUsers.page, pageSize: reviewsUsers.pageSize });
  if (reviewsUsers.search) qs.set("search", reviewsUsers.search);
  let d;
  try { d = await acct("/users?" + qs, null, "reviews"); }
  catch (e) { wrap.innerHTML = `<div class="empty">Couldn't load users: ${esc(e.message)}</div>`; if ($("rv-upager")) $("rv-upager").innerHTML = ""; return; }
  if (!d.users.length) { wrap.innerHTML = `<div class="empty">No users found.</div>`; $("rv-upager").innerHTML = ""; return; }
  wrap.innerHTML = `<table><thead><tr>
      <th>Email</th><th>Plan</th><th>Platform</th><th class="right">Views / quota</th><th class="right">Businesses</th><th>Joined</th>
    </tr></thead><tbody>${d.users.map((u) => `<tr class="clickable" data-id="${u.id}">

      <td>${planBadge(u.plan)}</td>
      <td>${platformBadge(u.platform)}</td>
      <td class="right">${fmt(u.viewsThisMonth)}${u.quota>0?" / "+fmt(u.quota):" / ∞"}</td>
      <td class="right">${fmt(u.businesses)}</td>
      <td>${date(u.createdAt)}</td>
    </tr>`).join("")}</tbody></table>`;
  wrap.querySelectorAll("tr.clickable").forEach((r) => r.onclick = () => openUser(r.dataset.id));
  const pages = Math.max(1, Math.ceil(d.total / d.pageSize));
  $("rv-upager").innerHTML = `<span>${d.total} user(s) · page ${d.page}/${pages}</span>
    <button class="btn btn-line btn-sm" ${d.page<=1?"disabled":""} id="rv-prev">← Prev</button>
    <button class="btn btn-line btn-sm" ${d.page>=pages?"disabled":""} id="rv-next">Next →</button>`;

      ${dom ? `<div class="kpi"><div class="k-label">Plugin users</div><div class="k-val">${fmt(dom.users.total)}</div><div class="k-sub">+${fmt(dom.users.newThisMonth)} this month</div></div>
      <div class="kpi"><div class="k-label">Sites</div><div class="k-val">${fmt(dom.configs.total)}</div><div class="k-sub">${fmt(dom.configs.maintenanceOn)} in maintenance now</div></div>
      <div class="kpi"><div class="k-label">Blocked (all-time)</div><div class="k-val">${fmt(dom.allTime.blocked)}</div><div class="k-sub">${fmt(dom.allTime.bypassed)} bypassed via whitelist</div></div>
      <div class="kpi"><div class="k-label">Visits checked</div><div class="k-val">${fmt(dom.allTime.visits)}</div><div class="k-sub">all-time</div></div>` : ""}
    </div>
    ${!bill && !dom ? unavailable("Maintenance", rs[1]) : ""}
    <div class="grid-2" style="margin-bottom:16px">
      ${trend ? `<div class="panel"><h3>Blocked visitors · last 30 days</h3>
        ${barChart(trend.trend.map((t, i) => ({ v: t.blocked, tip: `${t.day}: ${fmt(t.blocked)} blocked`, label: i % 5 === 0 ? t.day.slice(8) : "" })))}</div>` : `<div class="panel">${unavailable("Trend", rs[2])}</div>`}
      ${planSplitPanel(bill)}
    </div>
    <div class="sec-title">Sites</div>
    ${sites ? `<div class="tablewrap">${sites.sites.length?`<table><thead><tr>
      <th>Owner</th><th>Label</th><th>In maintenance</th><th>Action</th><th class="right">IP whitelist</th><th>Schedule</th><th>Created</th>
    </tr></thead><tbody>${sites.sites.map((s)=>`<tr>
      <td>${shortId(s.userId)}</td><td>${esc(s.label||"-")}</td><td>${s.enabled?"🟠 on":"-"}</td><td>${esc(s.action||"-")}</td>
      <td class="right">${fmt(s.whitelistSize)}</td><td>${s.autoSchedule?"✓":"-"}</td><td>${date(s.createdAt)}</td>
    </tr>`).join("")}</tbody></table>`:`<div class="empty">No sites yet.</div>`}</div>` : unavailable("Sites", rs[3])}`;
}

/* Instagram — the funnel is the point of this page: of everyone who opens the
   plugin, where exactly do they stop? Steps count DISTINCT visitors, so one
   person previewing five profiles counts once. */
let igDays = 30;
const IG_STEP = {
  opened:            ["Opened the plugin",     "Plugin loaded in the Framer editor"],
  preview_requested: ["Submitted a handle",    "Typed a profile and pressed Preview"],
  preview_loaded:    ["Saw a feed",            "The scrape came back and rendered"],
  layout_picked:     ["Tried a layout",        "Changed layout at least once"],
  insert_clicked:    ["Pressed Insert",        "Clicked Insert to Canvas"],
  paywall_opened:    ["Saw the paywall",       "The plan chooser was shown"],
  checkout_started:  ["Opened Stripe",         "Checkout was launched"],
  unlocked:          ["Paid & came back",      "Returned with an active plan"],
  feed_created:      ["Feed on the canvas",    "A feed was saved and inserted"],
};
function igFunnelPanel(f, r) {
  if (!f) return `<div class="panel">${unavailable("Funnel", r)}</div>`;
  const top = f.steps.length ? f.steps[0].visitors : 0;
  const rows = f.steps.map((st, i) => {
    const meta = IG_STEP[st.step] || [st.step, ""];
    const pctTop = top ? Math.round((st.visitors / top) * 100) : 0;
    const from = st.fromPrevious === null ? "" :
      `<span class="${st.fromPrevious < 50 ? "bad" : "good"}">${st.fromPrevious}% of previous</span>`;
    const lost = i && st.droppedHere ? ` · ${fmt(st.droppedHere)} lost here` : "";
    return `<div style="margin-bottom:12px">
      <div class="kv" style="border:none;padding-bottom:3px">
        <span title="${esc(meta[1])}">${i + 1}. ${esc(meta[0])}</span>
        <strong>${fmt(st.visitors)} <span class="muted-sm">${from}${lost}</span></strong>
      </div>
      <div class="meter"><span style="width:${pctTop}%"></span></div></div>`;
  }).join("");
  const conv = top ? ((f.steps[f.steps.length - 1].visitors / top) * 100).toFixed(1) : "0";
  return `<div class="panel"><h3>Funnel · last ${f.days} days</h3>${rows}
    <div class="kv" style="margin-top:10px"><span>Open → feed on canvas</span><strong>${conv}%</strong></div>
    <div class="kv"><span>Previews that failed</span><strong>${fmt(f.failed)}</strong></div></div>`;
}
async function renderInstagram(head) {
  const rs = await Promise.allSettled([
    acct("/overview", null, "instagram"), api("/instagram/admin/overview"),
    api("/instagram/admin/funnel?days=" + igDays), api("/instagram/admin/feeds"),
  ]);
  const [bill, dom, funnel, feeds] = rs.map(val);
  const fn = dom && dom.funnel30d ? dom.funnel30d : null;
  $("view").innerHTML = `
    ${head("Instagram feeds, and where people stop between opening the plugin and paying.")}
    <div class="kpis">
      ${bill ? `<div class="kpi hero"><div class="k-label">MRR</div><div class="k-val">${money(bill.revenue.mrr)}</div><div class="k-sub">${money(bill.revenue.arr)} / year</div></div>
      <div class="kpi"><div class="k-label">Paying</div><div class="k-val">${fmt(bill.plans.paid)}</div><div class="k-sub">${fmt(bill.plans.starter || 0)} Starter · ${fmt(bill.plans.pro)} Pro</div></div>` : ""}
      ${dom ? `<div class="kpi"><div class="k-label">Feeds</div><div class="k-val">${fmt(dom.feeds)}</div><div class="k-sub">${fmt(dom.cachedHandles)} handles cached</div></div>` : ""}
      ${fn ? `<div class="kpi"><div class="k-label">Opened (30d)</div><div class="k-val">${fmt(fn.opened)}</div><div class="k-sub">${fmt(fn.previewed)} saw a feed</div></div>
      <div class="kpi"><div class="k-label">Reached checkout</div><div class="k-val">${fmt(fn.checkout)}</div><div class="k-sub">${fmt(fn.paywall)} saw the paywall</div></div>
      <div class="kpi"><div class="k-label">Converted</div><div class="k-val">${fmt(fn.unlocked)}</div><div class="k-sub">${fn.opened ? ((fn.unlocked / fn.opened) * 100).toFixed(1) : "0"}% of opens</div></div>` : ""}
    </div>
    ${!bill && !dom ? unavailable("Instagram", rs[1]) : ""}

    <div class="toolbar"><div class="sec-title" style="margin:0">Where people stop</div>
      <select id="ig-days" style="width:auto;margin-left:auto">
        ${[7, 30, 90].map((d) => `<option value="${d}" ${igDays === d ? "selected" : ""}>Last ${d} days</option>`).join("")}
      </select></div>
    <div class="grid-2" style="margin-bottom:16px">
      ${igFunnelPanel(funnel, rs[2])}
      ${funnel && funnel.trend.length ? `<div class="panel"><h3>Plugin opens · daily</h3>
        ${barChart(funnel.trend.map((t, i) => ({ v: t.opened, tip: `${t.day}: ${fmt(t.opened)} opened, ${fmt(t.converted)} converted`, label: i % 5 === 0 ? t.day.slice(8) : "" })))}
        <p class="note">Hover a bar for that day's conversions.</p></div>` : `<div class="panel"><div class="empty">No events yet.</div></div>`}
    </div>

    <div class="sec-title">Visitors · furthest step reached</div>
    ${funnel ? `<div class="tablewrap" style="margin-bottom:16px">${funnel.visitors.length ? `<table><thead><tr>
      <th>Who</th><th>Stopped at</th><th>Profiles previewed</th><th class="right">Events</th><th>First seen</th><th>Last seen</th>
    </tr></thead><tbody>${funnel.visitors.map((v) => `<tr>
      <td>${v.email ? esc(v.email) : shortId(v.anonId)}${v.converted ? ' <span class="badge b-active">converted</span>' : ""}</td>
      <td>${esc((IG_STEP[v.furthestStep] || [v.furthestStep])[0])}${v.failed ? ' <span class="badge b-canceled">preview failed</span>' : ""}</td>
      <td class="truncate">${v.handles.length ? v.handles.map((h) => "@" + esc(h)).join(", ") : "-"}</td>
      <td class="right">${fmt(v.events)}</td><td>${dt(v.firstSeen)}</td><td>${dt(v.lastSeen)}</td>
    </tr>`).join("")}</tbody></table>` : `<div class="empty">No plugin sessions recorded yet.</div>`}</div>` : unavailable("Visitors", rs[2])}

    <div class="sec-title">Feeds</div>
    ${feeds ? `<div class="tablewrap">${feeds.feeds.length ? `<table><thead><tr>
      <th>Owner</th><th>Handle</th><th>Layout</th><th>Mode</th><th>Created</th>
    </tr></thead><tbody>${feeds.feeds.map((f) => `<tr>
      <td>${f.email ? esc(f.email) : shortId(f.userId)}</td><td>@${esc(f.handle)}</td>
      <td>${esc(f.layout)}</td><td>${esc(f.mode)}</td><td>${date(f.createdAt)}</td>
    </tr>`).join("")}</tbody></table>` : `<div class="empty">No feeds created yet.</div>`}</div>` : unavailable("Feeds", rs[3])}`;
  if ($("ig-days")) $("ig-days").onchange = (e) => { igDays = Number(e.target.value); renderInstagram(head); };
}

boot();
</script>
</body>
</html>
