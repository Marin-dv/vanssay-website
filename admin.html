      <th>Site</th><th>Feed</th><th>Owner</th><th class="right">Loads</th><th>First seen</th><th>Last seen</th>
    </tr></thead><tbody>${sites.sites.map((x) => `<tr>
      <td><a href="${esc(x.origin + x.path)}" target="_blank" rel="noopener" style="color:var(--accent)">${esc(x.origin.replace(/^https?:\/\//, "") + x.path)}</a>${x.pageKnown ? "" : ' <span class="badge b-other">site</span>'}</td>

      <td>${x.email ? esc(x.email) : shortId(x.userId)}</td>
      <td class="right">${fmt(x.views)}</td><td>${date(x.firstSeen)}</td><td>${dt(x.lastSeen)}</td>
    </tr>`).join("")}</tbody></table>` : `<div class="empty">No live sites recorded yet. A row appears the first time a published page loads a feed.</div>`}</div>
    <p class="note" style="margin-bottom:16px">Browsers usually send only the site, not the exact page, so most rows are the whole

    <div class="sec-title">Cost per user · Apify scraping</div>
    ${costs ? `<div class="kpis" style="margin-bottom:10px">
      <div class="kpi"><div class="k-label">All-time spend</div><div class="k-val">${usd(costs.totals.allTimeUsd)}</div><div class="k-sub">every scrape we've paid for</div></div>
      <div class="kpi"><div class="k-label">Attributed to users</div><div class="k-val">${usd(costs.totals.attributedUsd)}</div><div class="k-sub">handles someone kept a feed on</div></div>
      <div class="kpi"><div class="k-label">Previews &amp; abandoned</div><div class="k-val">${usd(costs.totals.unattributedUsd)}</div><div class="k-sub">spend with no customer behind it</div></div>
    </div>
    <div class="tablewrap" style="margin-bottom:6px">${costs.users.length ? `<table><thead><tr>

    </tr></thead><tbody>${costs.users.map((u) => `<tr>

    <p class="note" style="margin-bottom:16px">We pay per handle, not per user: the feed cache is shared, so when two accounts show the same

    <div class="toolbar" style="margin-top:22px"><div class="sec-title" style="margin:0">Gift codes</div></div>

      <div class="toolbar" style="margin:0">
        <input id="gift-note" placeholder="Sent to (e.g. @the.matcho)" style="max-width:240px">

        <select id="gift-months" style="width:auto">${[1, 3, 6, 12].map((m) => `<option value="${m}" ${m === 3 ? "selected" : ""}>${m} month${m > 1 ? "s" : ""}</option>`).join("")}</select>
        <input id="gift-count" type="number" min="1" max="50" value="1" title="How many codes" style="width:70px">
        <button id="gift-gen" style="width:auto">Generate</button>
      </div>
      <div id="gift-out" class="note" style="margin-bottom:0"></div>
    </div>
    ${gifts ? `<div class="tablewrap">${gifts.codes.length ? `<table><thead><tr>
      <th>Code</th><th>Sent to</th><th>Plan</th><th>Status</th><th>Redeemed by</th><th>Access ends</th><th>Code expires</th><th></th>
    </tr></thead><tbody>${gifts.codes.map((g) => `<tr>
      <td><span class="mono">${esc(g.token)}</span></td>
      <td>${g.note ? esc(g.note) : "-"}</td>
      <td><span class="badge b-${esc(g.plan)}">${esc(g.plan)}</span> · ${g.months}mo</td>
      <td>${GIFT_BADGE[g.status] || esc(g.status)}</td>
      <td>${g.claimedByEmail ? esc(g.claimedByEmail) : g.claimedAt ? shortId(g.claimedByUserId) : "-"}</td>

    </tr>`).join("")}</tbody></table>` : `<div class="empty">No gift codes yet.</div>`}</div>` : unavailable("Gift codes", rs[4])}`;
  if ($("ig-days")) $("ig-days").onchange = (e) => { igDays = Number(e.target.value); renderInstagram(head); };
  let igUTimer;
  if ($("ig-search")) $("ig-search").oninput = (e) => { clearTimeout(igUTimer); igUTimer = setTimeout(() => { instagramUsers.search = e.target.value.trim(); instagramUsers.page = 1; loadInstagramUsers(feeds ? feeds.feeds : []); }, 300); };
  if ($("ig-refresh")) $("ig-refresh").onclick = () => loadInstagramUsers(feeds ? feeds.feeds : []);
  loadInstagramUsers(feeds ? feeds.feeds : []);

  if ($("gift-gen")) $("gift-gen").onclick = async () => {
    const btn = $("gift-gen"), out = $("gift-out");
    btn.disabled = true; out.textContent = "Generating…";

      const r = await acct("/gift-codes", { method: "POST", body: {
        plan: $("gift-plan").value,
        months: Number($("gift-months").value),
        count: Number($("gift-count").value) || 1,
        note: $("gift-note").value.trim() || undefined,

      catch (e) { alert(e.message); b.disabled = false; }

    b.onclick = async () => {

      b.disabled = true;

      catch (e) { alert(e.message); b.disabled = false; }
    };
  });

boot();
