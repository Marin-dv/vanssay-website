<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin | Vanssay</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" href="/favicon-48.png" sizes="48x48" />
<link rel="apple-touch-icon" href="/favicon-180.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --bg:#f7f7f8; --surface:#fff; --surface-2:#f4f4f5; --border:#e6e6e9; --text:#18181b;
      --text-2:#52525b; --muted:#a1a1aa; --accent:#4f46e5; --accent-soft:#eef0fe; --pro:#6d5cf0;
      --ink:#141417; --error:#dc2626; --green:#16a34a; --amber:#d97706;
      --shadow:0 1px 2px rgba(24,24,27,.05); --shadow-md:0 10px 34px rgba(24,24,27,.09);
    }
    body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); line-height:1.55; min-height:100vh; -webkit-font-smoothing:antialiased; font-size:14px; }
    a { color:var(--accent); text-decoration:none; }
    button { font:inherit; cursor:pointer; }
    .hidden { display:none !important; }

    /* ── Auth gate ── */
    .gate { max-width:400px; margin:0 auto; padding:80px 24px; }
    .gate h1 { font-size:26px; font-weight:900; letter-spacing:-.02em; margin-bottom:6px; }
    .gate p { color:var(--text-2); margin-bottom:22px; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow-md); }
    .gate .card { padding:26px; }
    label { display:block; font-size:12.5px; font-weight:600; margin:14px 0 5px; }
    input, select { width:100%; padding:10px 13px; border:1px solid var(--border); border-radius:9px; font:inherit; font-size:14px; outline:none; background:#fff; }
    input:focus, select:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:10px 16px; border-radius:10px; font-size:13.5px; font-weight:700; border:1px solid transparent; background:var(--surface-2); color:var(--text); }
    .btn:hover { filter:brightness(.98); }
    .btn-blue { background:var(--accent); color:#fff; }
    .btn-line { background:#fff; border-color:var(--border); }
    .btn-danger { background:var(--error); color:#fff; }
    .btn-full { width:100%; margin-top:18px; }
    .btn-sm { padding:7px 12px; font-size:12.5px; }
    .err { background:#fdecec; color:var(--error); border-radius:9px; padding:9px 13px; font-size:12.5px; margin-top:12px; display:none; }
    .ok { background:#e9f7ef; color:var(--green); border-radius:9px; padding:9px 13px; font-size:12.5px; margin-top:12px; display:none; }

    /* ── Alerts (diagnostics warnings) ── */
    .alerts { display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
    .alert { display:flex; gap:10px; align-items:flex-start; padding:11px 14px; border-radius:11px; border:1px solid var(--border); background:var(--surface); font-size:13px; }
    .alert strong { display:block; font-size:13.5px; }
    .alert span.a-detail { color:var(--text-2); }
    .alert.a-critical { border-color:#f5c2c2; background:#fdecec; }
    .alert.a-critical strong { color:var(--error); }
    .alert.a-warning { border-color:#f3ddb4; background:#fdf5e7; }
    .alert.a-warning strong { color:var(--amber); }
    .alert.a-ok { border-color:#bfe6cd; background:#e9f7ef; }
    .alert.a-ok strong { color:var(--green); }

    /* ── Shell ── */
    .shell { display:none; min-height:100vh; grid-template-columns:236px 1fr; }
    aside { background:var(--surface); border-right:1px solid var(--border); padding:20px 14px; position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:2px; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:15.5px; letter-spacing:-.01em; padding:2px 8px 16px; }
    .brand .logo { width:28px; height:28px; border-radius:8px; background:var(--ink); display:flex; align-items:center; justify-content:center; flex:none; }
    .navlink { display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:9px; color:var(--text-2); font-weight:600; font-size:13.5px; border:none; background:none; width:100%; text-align:left; position:relative; transition:background .12s,color .12s; }
    .navlink:hover { background:var(--surface-2); color:var(--text); }
    .navlink.active { background:var(--accent-soft); color:var(--accent); }
    .navlink.active::before { content:""; position:absolute; left:-14px; top:8px; bottom:8px; width:3px; border-radius:0 3px 3px 0; background:var(--accent); }
    .navlink .ic { width:18px; text-align:center; font-size:14px; display:inline-flex; align-items:center; justify-content:center; }
    .navlink .ic svg { width:16px; height:16px; }
    .navsep { font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:700; margin:16px 11px 5px; }
    .aside-foot { margin-top:auto; font-size:12px; color:var(--muted); padding:12px 8px 0; border-top:1px solid var(--border); }
    main { padding:30px 34px 70px; max-width:1240px; }
    .page-head { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:22px; gap:16px; flex-wrap:wrap; }
    h2 { font-size:22px; font-weight:900; letter-spacing:-.02em; }
    .page-head p { color:var(--text-2); font-size:13px; }
    .prodbar { display:inline-flex; background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:3px; gap:2px; }
    .prodbar .pb { border:0; background:none; padding:6px 13px; border-radius:7px; font:inherit; font-size:13px; font-weight:600; color:var(--text-2); cursor:pointer; }
    .prodbar .pb.on { background:var(--surface); color:var(--accent); box-shadow:0 1px 2px rgba(0,0,0,.08); }

    /* ── KPI cards ── */
    .kpis { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px; margin-bottom:24px; }
    .kpi { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 18px; box-shadow:var(--shadow); }
    .kpi .k-label { font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.03em; }
    .kpi .k-val { font-size:26px; font-weight:900; letter-spacing:-.02em; margin-top:4px; }
    .kpi .k-sub { font-size:12px; color:var(--text-2); margin-top:2px; }
    .kpi.hero { background:var(--ink); color:#fff; border:none; }
    .kpi.hero .k-label, .kpi.hero .k-sub { color:rgba(255,255,255,.6); }

    .grid-2 { display:grid; grid-template-columns:1.4fr 1fr; gap:16px; }
    .grid-eq { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    @media (max-width:900px){ .grid-2, .grid-eq { grid-template-columns:1fr; } .shell { grid-template-columns:1fr; } aside { position:static; height:auto; flex-direction:row; flex-wrap:wrap; } }
    .panel { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px 20px; box-shadow:var(--shadow); }
    .panel h3 { font-size:14px; font-weight:800; margin-bottom:14px; }
    .panel h3 .open { float:right; font-size:12px; font-weight:600; }
    .prodgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; margin-bottom:24px; }
    .prodgrid .mrr { font-size:24px; font-weight:900; letter-spacing:-.02em; margin:2px 0 10px; }
    .prodgrid .mrr small { font-size:12px; color:var(--muted); font-weight:600; }

    /* ── Bar chart ── */
    .chart { display:flex; align-items:flex-end; gap:6px; height:140px; }
    .bar { flex:1; background:var(--accent); border-radius:5px 5px 0 0; min-height:3px; position:relative; opacity:.85; }
    .bar:hover { opacity:1; }
    .bar:hover::after { content:attr(data-tip); position:absolute; bottom:100%; left:50%; transform:translateX(-50%); background:#18181b; color:#fff; font-size:11px; padding:4px 8px; border-radius:6px; white-space:nowrap; margin-bottom:5px; z-index:5; }
    .chart-x { display:flex; gap:6px; margin-top:6px; }
    .chart-x span { flex:1; text-align:center; font-size:10px; color:var(--muted); overflow:hidden; }
    /* Sales curves: one line per plugin plus the total, all in dollars on one
       axis. Hover reads a whole month at once, which a per-bar tooltip cannot. */
    .lchart { position:relative; }
    .lchart svg { display:block; width:100%; height:auto; overflow:visible; touch-action:none; }
    .lc-grid { stroke:var(--border); stroke-width:1; }
    .lc-axis { fill:var(--muted); font-size:10px; font-family:'Inter',sans-serif; }
    .lc-cross { stroke:var(--muted); stroke-width:1; stroke-dasharray:3 3; opacity:0; }
    .lc-dot { stroke:var(--surface); stroke-width:2; }
    .lc-hot { opacity:0; }
    .lc-tip { position:absolute; pointer-events:none; opacity:0; transition:opacity .12s ease; z-index:6;
              background:#18181b; color:#fff; font-size:11.5px; line-height:1.6; padding:8px 10px;
              border-radius:7px; white-space:nowrap; transform:translate(-50%,-100%); box-shadow:var(--shadow-md); }
    .lc-tip .h { font-weight:700; margin-bottom:3px; }
    .lc-tip .r { display:flex; align-items:center; gap:8px; }
    .lc-tip .r span { flex:1; color:rgba(255,255,255,.7); }
    .lc-tip .r b { font-variant-numeric:tabular-nums; }
    .lc-tip i, .legend i { width:9px; height:9px; border-radius:3px; display:inline-block; flex:none; }
    .legend { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:12px; font-size:11.5px; color:var(--text-2); }
    .legend span { display:inline-flex; align-items:center; gap:6px; }
    .lc-table { margin-top:12px; font-size:12px; color:var(--text-2); }
    .lc-table summary { cursor:pointer; color:var(--muted); font-weight:600; }
    .lc-table table { margin-top:8px; }

    /* ── Tables ── */
    .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
    .toolbar input, .toolbar select { width:auto; }
    .toolbar input.search { min-width:240px; }
    .tablewrap { background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; box-shadow:var(--shadow); }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:700; padding:12px 14px; border-bottom:1px solid var(--border); background:#fafafa; }
    td { padding:11px 14px; border-bottom:1px solid var(--border); vertical-align:middle; }
    tr:last-child td { border-bottom:none; }
    tbody tr.clickable:hover { background:#f8fafc; cursor:pointer; }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; color:var(--text-2); }
    .truncate { max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    /* For values you actually need to read in full (Trustpilot URLs): wrap
       instead of ellipsing, since the part that matters is at the end. */
    .breakurl { white-space:normal; overflow-wrap:anywhere; word-break:break-word; min-width:200px; }
    .right { text-align:right; }
    .empty { padding:40px; text-align:center; color:var(--muted); }
    .note { font-size:12px; color:var(--muted); padding:8px 2px; }

    .badge { display:inline-flex; padding:2px 10px; border-radius:99px; font-size:11.5px; font-weight:800; white-space:nowrap; }
    .b-free { background:var(--surface-2); color:var(--text-2); } .b-pro { background:var(--accent-soft); color:var(--pro); } .b-ultra { background:var(--ink); color:#fff; }
    .b-starter { background:#fdecf3; color:#e0457b; }
    .b-active { background:#e9f7ef; color:var(--green); } .b-canceled { background:#fdecec; color:var(--error); } .b-other { background:var(--surface-2); color:var(--text-2); }
    .b-framer { background:#eef1f4; color:#111318; } .b-webflow { background:#e6f0ff; color:#155cc4; }
    .badges { display:flex; gap:5px; flex-wrap:wrap; }
    .pager { display:flex; align-items:center; gap:12px; justify-content:flex-end; margin-top:14px; font-size:13px; color:var(--text-2); }
    .meter { height:7px; border-radius:99px; background:var(--surface-2); overflow:hidden; }
    .meter span { display:block; height:100%; background:var(--accent); }

    /* ── Modal ── */
    .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; justify-content:flex-end; z-index:50; }
    .modal { width:560px; max-width:100%; background:var(--bg); height:100%; overflow-y:auto; padding:26px 28px; box-shadow:-10px 0 40px rgba(0,0,0,.2); animation:slidein .18s ease; }
    @keyframes slidein { from { transform:translateX(30px); opacity:.6; } to { transform:none; opacity:1; } }
    .modal-head { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:18px; }
    .modal-head h3 { font-size:18px; font-weight:900; word-break:break-all; }
    .x { background:none; border:none; font-size:22px; color:var(--muted); line-height:1; }
    .modal .card { padding:18px; margin-bottom:14px; }
    .field-row { display:flex; gap:10px; align-items:flex-end; }
    .field-row > div { flex:1; }
    .kv { display:flex; justify-content:space-between; gap:12px; padding:5px 0; font-size:13px; border-bottom:1px dashed var(--border); }
    .kv:last-child { border-bottom:none; }
    .kv span:first-child { color:var(--text-2); }
    .sec-title { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:700; margin:18px 0 8px; }
    .planrow { display:grid; grid-template-columns:110px 1fr auto; gap:10px; align-items:center; margin-bottom:8px; }
    .planrow .pname { font-weight:700; font-size:13px; }
    .ministat { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .ministat .kpi { padding:12px 14px; } .ministat .k-val { font-size:20px; }
    .muted-sm { font-weight:600; font-size:11.5px; color:var(--text-2); }
    .muted-sm .good { color:#16a34a; } .muted-sm .bad { color:#dc2626; }
  </style>
</head>
<body>

<!-- ── Login gate ── -->
<div class="gate" id="gate">
  <h1>Admin</h1>
  <p>Sign in with an admin account.</p>
  <div class="card">
    <label>Email</label>
    <input id="g-email" type="email" placeholder="you@vanssay.net" autocomplete="email" />
    <label style="display:flex;justify-content:space-between">Password <a id="g-toggle" style="cursor:pointer">Show</a></label>
    <input id="g-pass" type="password" placeholder="Your password" autocomplete="current-password" />
    <div class="err" id="g-err"></div>
    <button class="btn btn-blue btn-full" id="g-btn">Sign in</button>
  </div>
</div>

<!-- ── App shell ── -->
<div class="shell" id="shell">
  <aside>
    <div class="brand">
      <span class="logo"><svg width="16" height="16" viewBox="0 0 40 40"><path d="M6,4H15L27,36H18Z" fill="#fff"/><path d="M34,4H25L13,36H22Z" fill="#8b8bff"/></svg></span>
      Vanssay <span style="color:var(--muted);font-weight:600">Admin</span>
    </div>
    <div class="navsep">Workspace</div>
    <button class="navlink active" data-tab="overview"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg></span> Overview</button>
    <button class="navlink" data-tab="users"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg></span> Users</button>
    <button class="navlink" data-tab="subs"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg></span> Subscriptions</button>
    <button class="navlink" data-tab="expenses"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1v22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></span> Expenses</button>
    <button class="navlink" data-tab="diag"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></span> Diagnostics</button>
    <button class="navlink" data-tab="site"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></span> Website</button>
    <div class="navsep">Plugins</div>
    <div id="prod-nav"></div>
    <div class="aside-foot">
      <div id="admin-email" style="margin-bottom:8px;color:var(--text-2);font-weight:600"></div>
      <button class="btn btn-line btn-sm" id="signout">Sign out</button>
    </div>
  </aside>

  <main id="view"></main>
</div>

<div id="modal-root"></div>

<script>
const API = localStorage.getItem("vanssay.apiBase") || "https://api.vanssay.net";
const TKEY = "vanssay.token";

/* ── Product registry ─────────────────────────────────────────────────────────
   One entry per plugin. `base` = the plugin backend's path prefix on the API
   host ("" = the Accounts/Reviews service itself). Adding a future plugin =
   add a row here + (if it has its own backend) it gets a sidebar page free. */
// `activity` = where that plugin answers "which users are actually using me",
// as [path, key of the array in the response]. Every row carries a userId (the
// shared Accounts id). It differs per plugin because the plugins differ: the
// blockers key off a site config, Instagram off a connected feed. Reviews is
// not listed because its own /users payload already carries businesses + views.
const PRODUCTS = [
  { key: "reviews",     label: "Reviews",     icon: "⭐", base: "",             cache: true,  activity: null, color: "#2b50ff" },
  { key: "geoblock",    label: "Bouncer",     icon: "🛡️", base: "/geoblock",    cache: true,  activity: ["/admin/sites", "sites"], color: "#16a34a" },
  { key: "router",      label: "Router",      icon: "🧭", base: "/router",      cache: true,  activity: ["/admin/sites", "sites"], color: "#7c3aed" },
  { key: "instagram",   label: "Instagram",   icon: "📸", base: "/instagram",   cache: false, activity: ["/admin/feeds", "feeds"], color: "#e0457b" },
  { key: "maintenance", label: "Maintenance", icon: "🚧", base: "/maintenance", cache: false, activity: ["/admin/sites", "sites"], color: "#0891b2" },
];
const PROD = Object.fromEntries(PRODUCTS.map((p) => [p.key, p]));

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));
const fmt = (n) => Number(n || 0).toLocaleString();
const money = (n) => "$" + Number(n || 0).toLocaleString();
// Invoiced amounts are cents and rarely land on a whole dollar, so $89.50 must
// not read as "$89.5" — and $1,200.00 must not carry two pointless zeros.
const moneyCents = (c) => "$" + (Number(c || 0) / 100).toLocaleString(undefined, {
  minimumFractionDigits: Number(c || 0) % 100 ? 2 : 0, maximumFractionDigits: 2 });
// "2026-08" is a key, not a label. Charts and tooltips show the month the
// way a person says it.
const monthLabel = (m) => {
  const [y, mo] = String(m).split("-");
  return new Date(Date.UTC(Number(y), Number(mo) - 1, 1)).toLocaleDateString(undefined, { month: "short", year: "numeric" });
};
const date = (d) => d ? new Date(d).toLocaleDateString(undefined, { year:"numeric", month:"short", day:"numeric" }) : "-";
const dt = (d) => d ? new Date(d).toLocaleString(undefined, { month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" }) : "-";
// Apify costs are tiny (fractions of a cent → a few $); show enough precision to be useful.
const usd = (n) => { n = Number(n || 0); return "$" + (n >= 1 ? n.toFixed(2) : n.toFixed(4)); };
// A Trustpilot URL's useful part (the business slug) sits at the END, so an
// ellipsis hid exactly what we needed. Render it whole, wrapped and clickable.
const tpLink = (url) => url
  ? `<a href="${esc(url)}" target="_blank" rel="noopener" title="${esc(url)}">${esc(String(url).replace(/^https?:\/\/(www\.)?/, ""))}</a>`
  : "-";
const planBadge = (p) => { p = p || "free"; return `<span class="badge b-${esc(p)}">${esc(p[0].toUpperCase()+p.slice(1))}</span>`; };
// Signup platform (host): Framer or Webflow.
const platformBadge = (p) => { const k = p === "webflow" ? "webflow" : "framer"; const lbl = k === "webflow" ? "Webflow" : "Framer"; return `<span class="badge b-${k}">${k==="webflow"?"◇":"◆"} ${lbl}</span>`; };
const statusBadge = (s) => { const k = s==="active"||s==="trialing"?"b-active":s==="canceled"?"b-canceled":"b-other"; return `<span class="badge ${k}">${esc(s||"-")}</span>`; };
const flag = (cc) => (cc && cc.length === 2 ? cc.toUpperCase().replace(/./g, (c) => String.fromCodePoint(127397 + c.charCodeAt(0))) : "🏳️");
const minStarsLabel = (n) => (Number(n) > 1 ? Number(n) + "★+" : '<span class="muted">All</span>');

async function api(path, opts) {
  opts = opts || {}; // guard: null must not crash on opts.body
  const headers = { ...(opts.body ? { "Content-Type": "application/json" } : {}) };
  const t = localStorage.getItem(TKEY);
  if (t) headers.Authorization = "Bearer " + t;
  const res = await fetch(API + path, { method: opts.method || "GET", headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

/* Money collected per month, as curves: one per plugin that has ever sold, plus
   the total. Every series is dollars, so they share one axis — a second scale
   would let any two of them be drawn into any relationship you like.

   Held in module scope so the hover layer can be bound after innerHTML. */
let salesState = null;

// Round a maximum up to something a person would choose for an axis.
function niceCeil(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const f = v / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}

/* Monotone cubic (Fritsch–Carlson). A plain Catmull-Rom overshoots between
   points, which on this chart would draw a month dipping below zero dollars or
   above a peak that never happened. */
function curvePath(pts) {
  const n = pts.length;
  if (!n) return "";
  if (n === 1) return `M${pts[0][0]},${pts[0][1]}`;
  const dx = [], dy = [], sl = [], m = [];
  for (let i = 0; i < n - 1; i++) { dx[i] = pts[i+1][0] - pts[i][0]; dy[i] = pts[i+1][1] - pts[i][1]; sl[i] = dy[i] / dx[i]; }
  m[0] = sl[0];
  for (let i = 1; i < n - 1; i++) m[i] = sl[i-1] * sl[i] <= 0 ? 0 : (sl[i-1] + sl[i]) / 2;
  m[n-1] = sl[n-2];
  for (let i = 0; i < n - 1; i++) {
    if (sl[i] === 0) { m[i] = 0; m[i+1] = 0; continue; }
    const a = m[i] / sl[i], b = m[i+1] / sl[i], h = Math.hypot(a, b);
    if (h > 3) { m[i] = 3 * a / h * sl[i]; m[i+1] = 3 * b / h * sl[i]; }
  }
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < n - 1; i++) {
    const t = dx[i] / 3;
    d += `C${pts[i][0]+t},${pts[i][1]+m[i]*t} ${pts[i+1][0]-t},${pts[i+1][1]-m[i+1]*t} ${pts[i+1][0]},${pts[i+1][1]}`;
  }
  return d;
}

function salesChart(d) {
  const sold = PRODUCTS.filter((p) => d.series.some((m) => m.byProduct[p.key]));
  const n = d.series.length;
  // With one selling plugin its curve IS the total; two identical lines would
  // only make the chart look busier than the business is.
  const lines = (sold.length > 1
    ? [{ label: "Total", color: "#18181b", w: 2.75, vals: d.series.map((m) => m.cents) }]
    : []
  ).concat(sold.map((p) => ({ label: p.label, color: p.color, w: 2, vals: d.series.map((m) => m.byProduct[p.key] || 0) })));

  if (!lines.length) return `<div class="empty">No sales recorded yet.</div>`;

  const W = 760, H = 252, T = 14, B = 28, LEFT = 56;
  // Room on the right for direct labels, but only while there are few enough
  // for them to be read rather than untangled.
  const direct = lines.length <= 4;
  const RIGHT = direct ? 104 : 16;
  const iw = W - LEFT - RIGHT, ih = H - T - B;
  const top = niceCeil(Math.max(1, ...lines.map((l) => Math.max(...l.vals))) * 1.08);
  const X = (i) => LEFT + (n === 1 ? iw / 2 : (i / (n - 1)) * iw);
  const Y = (c) => T + ih - (c / top) * ih;

  const ticks = [0, 0.25, 0.5, 0.75, 1].map((f) => f * top);
  const step = Math.max(1, Math.ceil(n / 12));

  // Direct labels, pushed apart so a tight month cannot overlap two of them.
  const ends = lines.map((l, i) => ({ i, y: Y(l.vals[n-1]), label: l.label, color: l.color }))
    .sort((a, b) => a.y - b.y);
  for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i-1].y < 14) ends[i].y = ends[i-1].y + 14;

  salesState = { d, lines, n, W, X, Y, LEFT, RIGHT, T, ih };

  return `<div class="lchart" id="lchart">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sales per month, in dollars, per plugin and in total">
      ${ticks.map((t) => `<line class="lc-grid" x1="${LEFT}" x2="${W - RIGHT}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/>
        <text class="lc-axis" x="${LEFT - 8}" y="${(Y(t) + 3.5).toFixed(1)}" text-anchor="end">${esc(moneyCents(t))}</text>`).join("")}
      ${d.series.map((m, i) => i % step === 0 || i === n - 1
        ? `<text class="lc-axis" x="${X(i).toFixed(1)}" y="${H - 9}" text-anchor="middle">${esc(monthLabel(m.month))}</text>` : "").join("")}
      <line class="lc-cross" id="lc-cross" y1="${T}" y2="${T + ih}" x1="0" x2="0"/>
      ${lines.map((l) => `<path d="${curvePath(l.vals.map((v, i) => [X(i), Y(v)]))}" fill="none" stroke="${l.color}"
        stroke-width="${l.w}" stroke-linecap="round" stroke-linejoin="round"/>`).join("")}
      ${n <= 24 ? lines.map((l) => l.vals.map((v, i) =>
        `<circle class="lc-dot" cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="4" fill="${l.color}"/>`).join("")).join("") : ""}
      ${lines.map((l, i) => `<circle class="lc-dot lc-hot" id="lc-hot-${i}" r="5.5" fill="${l.color}" cx="0" cy="0"/>`).join("")}
      ${direct ? ends.map((e) => `<circle cx="${W - RIGHT + 22}" cy="${e.y.toFixed(1)}" r="4" fill="${e.color}"/>
        <text class="lc-axis" x="${W - RIGHT + 31}" y="${(e.y + 3.5).toFixed(1)}" style="fill:var(--text-2);font-weight:600">${esc(e.label)}</text>`).join("") : ""}
      <rect id="lc-hit" x="${LEFT}" y="${T}" width="${iw}" height="${ih}" fill="transparent"/>
    </svg>
    <div class="lc-tip" id="lc-tip"></div>
  </div>
  <div class="legend">${lines.map((l) => `<span><i style="background:${l.color}"></i>${esc(l.label)}</span>`).join("")}</div>
  <details class="lc-table"><summary>Show the numbers</summary>
    <div class="tablewrap"><table><thead><tr><th>Month</th><th class="right">Payments</th>
      ${lines.map((l) => `<th class="right">${esc(l.label)}</th>`).join("")}</tr></thead>
      <tbody>${d.series.map((m, i) => `<tr><td>${esc(monthLabel(m.month))}</td><td class="right">${fmt(m.count)}</td>
        ${lines.map((l) => `<td class="right">${esc(moneyCents(l.vals[i]))}</td>`).join("")}</tr>`).join("")}</tbody>
    </table></div>
  </details>`;
}

/* Crosshair + one tooltip for the whole month. Bound after the panel's HTML
   lands, because that is when the nodes exist. */
function bindSalesChart() {
  const st = salesState, wrap = $("lchart");
  if (!st || !wrap) return;
  const svg = wrap.querySelector("svg"), tip = $("lc-tip"), cross = $("lc-cross");
  const hots = st.lines.map((l, i) => $("lc-hot-" + i));

  const show = (i) => {
    const x = st.X(i);
    cross.setAttribute("x1", x); cross.setAttribute("x2", x); cross.style.opacity = "1";
    hots.forEach((h, k) => {
      h.setAttribute("cx", x); h.setAttribute("cy", st.Y(st.lines[k].vals[i])); h.style.opacity = "1";
    });
    const m = st.d.series[i];
    tip.innerHTML = `<div class="h">${esc(monthLabel(m.month))} · ${fmt(m.count)} payment${m.count === 1 ? "" : "s"}</div>`
      + st.lines.map((l) => `<div class="r"><i style="background:${l.color}"></i><span>${esc(l.label)}</span><b>${esc(moneyCents(l.vals[i]))}</b></div>`).join("");
    // Percent of the SVG's own width, so the tooltip follows the chart at any
    // panel size without measuring anything. Near either end it anchors to its
    // own edge instead of its centre, or it would hang off the panel.
    const pct = (x / st.W) * 100;
    tip.style.left = pct + "%";
    tip.style.top = (st.T + st.ih) * 100 / 252 + "%";
    tip.style.transform = pct < 16 ? "translate(0,-100%)" : pct > 84 ? "translate(-100%,-100%)" : "translate(-50%,-100%)";
    tip.style.opacity = "1";
  };
  const hide = () => {
    cross.style.opacity = "0"; tip.style.opacity = "0";
    hots.forEach((h) => h.style.opacity = "0");
  };

  const move = (ev) => {
    const r = svg.getBoundingClientRect();
    const vx = ((ev.clientX - r.left) / r.width) * st.W;
    const f = st.n === 1 ? 0 : (vx - st.LEFT) / (st.W - st.LEFT - st.RIGHT);
    show(Math.max(0, Math.min(st.n - 1, Math.round(f * (st.n - 1)))));
  };
  // The hit area is the plot, but the pointer should keep reading while it
  // wanders over a curve near the edge — so listen on the whole svg.
  svg.addEventListener("pointermove", move);
  svg.addEventListener("pointerleave", hide);
}

// Plan mix for a product. Lifetime and gifted are listed on their own: both

function planBreakdown(pl) {
  const parts = [];
  if (pl.starter) parts.push(fmt(pl.starter) + " Starter");
  if (pl.pro) parts.push(fmt(pl.pro) + " Pro");
  if (pl.ultra) parts.push(fmt(pl.ultra) + " Ultra");

  if (pl.gifted) parts.push(fmt(pl.gifted) + " gifted");
  return fmt(pl.paid) + (parts.length ? " · " + parts.join(" / ") : "");
}

/* ── Users, one global account list ──
   Shows each account, where it signed up (Framer / Webflow) and which plugins it
   is actively using. Reviews-specific numbers (views, businesses) live on the
   Reviews page now, not here. */
let usersState = { search: "", source: "", page: 1, pageSize: 25 };
async function renderUsers() {
  $("view").innerHTML = `
    <div class="page-head"><div><h2>Users</h2><p>Every account, where it signed up and which plugins it actively uses. Click a row for full detail & overrides.</p></div></div>
    <div class="toolbar">
      <input class="search" id="u-search" placeholder="Search by email…" value="${esc(usersState.search)}" />
      <select id="u-source">
        <option value="">All platforms</option>
        <option value="framer" ${usersState.source==="framer"?"selected":""}>Framer</option>
        <option value="webflow" ${usersState.source==="webflow"?"selected":""}>Webflow</option>
      </select>
      <button class="btn btn-line btn-sm" id="u-refresh">Refresh</button>
    </div>
    <div class="tablewrap" id="u-table"><div class="empty">Loading…</div></div>
    <div class="pager" id="u-pager"></div>`;
  let timer;
  $("u-search").oninput = (e) => { clearTimeout(timer); timer = setTimeout(() => { usersState.search = e.target.value.trim(); usersState.page = 1; loadUsers(); }, 300); };
  $("u-source").onchange = (e) => { usersState.source = e.target.value; usersState.page = 1; loadUsers(); };
  $("u-refresh").onclick = loadUsers;
  loadUsers();
}
async function loadUsers() {
  const wrap = $("u-table");
  const qs = new URLSearchParams({ page: usersState.page, pageSize: usersState.pageSize });
  if (usersState.search) qs.set("search", usersState.search);
  if (usersState.source) qs.set("source", usersState.source);
  // Same page of the same (global) user list, once per product → merge plans by id.
  // In parallel, pull each plugin's owners so we can flag *free* users who are
  // still actively using it (e.g. a free Bouncer site, or a free Instagram feed).
  // Reviews' activity comes back in its own users payload (businesses/views); the
  // others answer on their own backend, at the path PRODUCTS[].activity names —
  // NOT one shared route. Instagram has no /admin/sites at all, so asking every
  // plugin for that path 404'd there and silently dropped its badge: an account
  // using Reviews and Instagram only ever showed Reviews.
  const [rs, siteRs] = await Promise.all([
    Promise.allSettled(PRODUCTS.map((p) => acct("/users?" + qs, null, p.key))),
    Promise.allSettled(PRODUCTS.map((p) => (p.activity ? api(p.base + p.activity[0]) : Promise.resolve(null)))),
  ]);
  const base = val(rs[0]);
  if (!base) { wrap.innerHTML = unavailable("Users", rs[0]); $("u-pager").innerHTML = ""; return; }
  const planOf = {}, rowOf = {}, activeIds = {};
  PRODUCTS.forEach((p, i) => { const d = val(rs[i]); planOf[p.key] = new Map((d ? d.users : []).map((u) => [u.id, u.plan]));
    rowOf[p.key] = new Map((d ? d.users : []).map((u) => [u.id, u]));
    const sd = val(siteRs[i]);
    const rows = sd && p.activity ? sd[p.activity[1]] : null;
    activeIds[p.key] = new Set(Array.isArray(rows) ? rows.map((r) => r.userId).filter(Boolean) : []); });

  // "Actively using" = paid on that plugin, or free but with something to show
  // for it there: a site config, an Instagram feed, or (reviews) businesses and
  // views. The free signal is capped by each backend's own list size (feeds take
  // 200, sites 500), so a very old free account can age out of its badge.
  const usesPlugin = (u, key) => {
    const pl = planOf[key].get(u.id) || "free";
    if (pl !== "free") return true;
    if (key === "reviews") { const r = rowOf.reviews.get(u.id) || u; return (r.businesses || 0) > 0 || (r.viewsThisMonth || 0) > 0; }
    return activeIds[key] ? activeIds[key].has(u.id) : false;
  };

  if (!base.users.length) { wrap.innerHTML = `<div class="empty">No users found.</div>`; $("u-pager").innerHTML = ""; return; }
  wrap.innerHTML = `<table><thead><tr>
      <th>Email</th><th>Platform</th><th>Actively using</th><th>Joined</th>
    </tr></thead><tbody>${base.users.map((u) => {
      const badges = PRODUCTS.filter((p) => usesPlugin(u, p.key)).map((p) => {
        const pl = planOf[p.key].get(u.id) || "free";
        return `<span class="badge b-${pl==="free"?"active":pl}" title="${esc(p.label)} · ${pl}">${p.icon} ${esc(p.label)}${pl!=="free"?" · "+pl[0].toUpperCase()+pl.slice(1):""}</span>`;
      }).join("") || `<span class="note" style="padding:0">Not active yet</span>`;
      return `<tr class="clickable" data-id="${u.id}">
        <td>${esc(u.email)}</td>
        <td>${platformBadge(u.platform)}</td>
        <td><div class="badges">${badges}</div></td>
        <td>${date(u.createdAt)}</td>
      </tr>`;
    }).join("")}</tbody></table>`;
  wrap.querySelectorAll("tr.clickable").forEach((r) => r.onclick = () => openUser(r.dataset.id));
  const pages = Math.max(1, Math.ceil(base.total / base.pageSize));
  $("u-pager").innerHTML = `<span>${base.total} user(s) · page ${base.page}/${pages}</span>
    <button class="btn btn-line btn-sm" ${base.page<=1?"disabled":""} id="u-prev">← Prev</button>
    <button class="btn btn-line btn-sm" ${base.page>=pages?"disabled":""} id="u-next">Next →</button>`;
  if ($("u-prev")) $("u-prev").onclick = () => { usersState.page--; loadUsers(); };
  if ($("u-next")) $("u-next").onclick = () => { usersState.page++; loadUsers(); };
}

/* ── User detail modal, cross-plugin ──
   Shows one product's domain stats — whichever the user actually uses. `force`
   pins it (clicking from the Reviews or Instagram page's own user list); with
   no force (the global Users tab) it picks Reviews if they're active there,
   else Instagram, else neither. */
function productActivity(dets, igDetail) {
  const r = dets.reviews;
  const totalViews = r ? r.views.reduce((s, v) => s + v.views, 0) : 0;
  const isReviews = !!r && (r.plan !== "free" || r.configs.length > 0 || totalViews > 0);
  const i = dets.instagram;
  const isInstagram = !!igDetail && ((i && i.plan !== "free") || igDetail.feeds.length > 0 || (igDetail.funnel && igDetail.funnel.events > 0));
  return { isReviews, isInstagram, totalViews };
}
async function openUser(id, force) {
  const root = $("modal-root");
  root.innerHTML = `<div class="modal-bg"><div class="modal"><div class="empty">Loading…</div></div></div>`;
  root.querySelector(".modal-bg").onclick = (e) => { if (e.target.classList.contains("modal-bg")) root.innerHTML = ""; };
  // One detail call per product: plan + that product's subscriptions. The
  // reviews-domain payload (configs/views/pages) is identical in each response.
  const rs = await Promise.allSettled(PRODUCTS.map((p) => acct("/users/" + id, null, p.key)));
  const dets = {};
  PRODUCTS.forEach((p, i) => dets[p.key] = val(rs[i]));
  const base = PRODUCTS.map((p) => dets[p.key]).find(Boolean);
  if (!base) { root.querySelector(".modal").innerHTML = `<div class="err" style="display:block">${esc(why(rs[0]))}</div>`; return; }
  const u = base.user;
  // Instagram's own domain data (feeds/live sites/cost/funnel) — best-effort,
  // since the modal must still work if that plugin backend is unreachable.
  let igDetail = null;
  try { igDetail = await api("/instagram/admin/users/" + id); } catch {}

  const { isReviews, isInstagram, totalViews } = productActivity(dets, igDetail);
  const rv = dets.reviews;
  // A forced product (clicked from the Reviews/Instagram page's own list) can
  // still lack data if that call failed — fall back rather than crash on it.
  const showReviews = (force || (isReviews ? "reviews" : isInstagram ? "instagram" : null)) === "reviews" && !!rv;
  const showInstagram = (force || (isReviews ? "reviews" : isInstagram ? "instagram" : null)) === "instagram" && !!igDetail;
  const totalClicks = rv ? rv.pages.reduce((s, p) => s + p.poweredClicks, 0) : 0;
  const allSubs = PRODUCTS.flatMap((p) => (dets[p.key] ? dets[p.key].subscriptions : []).map((s) => ({ ...s, product: p })));

  const reviewsMinistat = `<div class="ministat" style="margin-bottom:14px">

        <div class="kpi"><div class="k-label">“Powered by” clicks</div><div class="k-val">${fmt(totalClicks)}</div></div>
      </div>`;
  const igMinistat = igDetail ? `<div class="ministat" style="margin-bottom:14px">
        <div class="kpi"><div class="k-label">Feeds</div><div class="k-val">${fmt(igDetail.feeds.length)}</div></div>
        <div class="kpi"><div class="k-label">Scrape cost (all-time)</div><div class="k-val">${usd(igDetail.cost.costUsd)}</div></div>
      </div>` : "";

  const reviewsSections = !rv ? "" : `

    <div class="card" style="padding:0;overflow:hidden">${rv.configs.length ? `<table><thead><tr><th>Google</th><th>Trustpilot</th><th>Min ★</th></tr></thead><tbody>
      ${rv.configs.map((c)=>`<tr><td>${esc(c.googleBusinessName||c.googlePlaceId||"-")}</td><td class="breakurl">${tpLink(c.trustpilotUrl)}</td><td>${minStarsLabel(c.minStars)}</td></tr>`).join("")}</tbody></table>` : `<div class="empty">No businesses connected.</div>`}</div>

    <div class="sec-title">Reviews · embed pages (${rv.pages.length})</div>

      ${rv.pages.map((p)=>`<tr><td class="truncate"><a href="${esc(p.pageUrl)}" target="_blank">${esc(p.pageUrl)}</a></td><td class="right">${fmt(p.views)}</td><td class="right">${fmt(p.poweredClicks)}</td></tr>`).join("")}</tbody></table>` : `<div class="empty">No embeds recorded yet.</div>`}</div>

    <div class="sec-title">Reviews · view history</div>

  const igSections = igDetail ? `
    <div class="sec-title">Instagram · feeds (${igDetail.feeds.length})</div>

      ${igDetail.feeds.map((f)=>`<tr><td>@${esc(f.handle)}</td><td>${esc(f.layout)}</td><td>${esc(f.mode)}</td><td>${date(f.createdAt)}</td></tr>`).join("")}</tbody></table>` : `<div class="empty">No feeds created.</div>`}</div>

    <div class="sec-title">Instagram · live sites (${igDetail.liveSites.length})</div>
    <div class="card" style="padding:0;overflow:hidden">${igDetail.liveSites.length ? `<table><thead><tr><th>Site</th><th>Feed</th><th class="right">Loads</th><th>Last seen</th></tr></thead><tbody>
      ${igDetail.liveSites.map((s)=>`<tr><td class="truncate"><a href="${esc(s.origin + s.path)}" target="_blank">${esc(s.origin.replace(/^https?:\/\//,"") + s.path)}</a></td><td>${s.handle?"@"+esc(s.handle):"-"}</td><td class="right">${fmt(s.views)}</td><td>${dt(s.lastSeen)}</td></tr>`).join("")}</tbody></table>` : `<div class="empty">No live sites recorded.</div>`}</div>

    <div class="sec-title">Instagram · funnel</div>
    <div class="card">${igDetail.funnel ? `
      <div class="kv"><span>Furthest step</span><span>${esc((IG_STEP[igDetail.funnel.furthestStep] || [igDetail.funnel.furthestStep])[0])}${igDetail.funnel.failed?' <span class="badge b-canceled">preview failed</span>':""}</span></div>

    <div class="sec-title">Instagram · scrape cost</div>

    </div>` : `<div class="sec-title">Instagram</div><div class="card"><div class="empty">Instagram data unavailable.</div></div>`;

  root.querySelector(".modal").innerHTML = `

      ${showReviews ? reviewsMinistat : showInstagram ? igMinistat : ""}
      <div class="kv"><span>Signed up on</span><span>${platformBadge(u.platform)}</span></div>
      <div class="kv"><span>User ID</span><span class="mono">${esc(u.id)}</span></div>
      <div class="kv"><span>Joined</span><span>${date(u.createdAt)}</span></div>
      <div class="kv"><span>Stripe customer</span><span class="mono">${esc(u.stripeCustomerId || "-")}</span></div>
      ${showReviews ? `<div class="kv"><span>Reviews monthly quota</span><span>${rv.quota>0?fmt(rv.quota):"Unlimited"}</span></div>` : ""}
    </div>

    <div class="card">
      <div class="field-row">
        <div><label>Email</label><input id="m-email" value="${esc(u.email)}" /></div>
        <button class="btn btn-blue" id="m-save-email">Save</button>
      </div>
      <label style="margin-top:14px">Plan per plugin (manual override, no Stripe charge)</label>
      ${PRODUCTS.map((p) => {
        const d = dets[p.key];
        return `<div class="planrow"><span class="pname">${p.icon} ${esc(p.label)}</span>
          ${d ? `<select id="m-plan-${p.key}">
            <option value="free" ${d.plan==="free"?"selected":""}>Free</option>
            <option value="pro" ${d.plan==="pro"?"selected":""}>Pro</option>
            <option value="ultra" ${d.plan==="ultra"?"selected":""}>Ultra</option>
          </select><button class="btn btn-line btn-sm" data-saveplan="${p.key}">Save</button>` : `<span class="note">unavailable</span><span></span>`}
        </div>`;

      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
        ${showReviews ? `<button class="btn btn-line btn-sm" id="m-resetviews">Reset month views (Reviews)</button>` : ""}

  const close = () => { root.innerHTML = ""; };

}

    <div class="tablewrap">${d.subscriptions.length?`<table><thead><tr>
      <th>Email</th><th>Plan</th><th>Status</th><th>Live</th><th class="right">MRR</th><th>Period end</th><th>Created</th><th>Stripe sub</th>

      ${ig ? `<div class="kpi"><div class="k-label">IG scrapes today</div><div class="k-val">${fmt(ig.scrapesToday)}</div><div class="k-sub">against the daily budget</div></div>` : ""}

/* ── Diagnostics ───────────────────────────────────────────────────────────────
   Two halves. On-demand health probes (they really call Google/Stripe and really
   run the scraper, so they're buttons), and the onboarding signals the backend
   now records: a user reading an empty widget, and a re-sync refused by the free
   cooldown. One of each in a row is a user staring at a blank widget. */
const ISSUE_LABEL = {
  empty_cache_read: "Empty widget read",
  refresh_throttled: "Re-sync throttled",
};
const issueBadge = (k) =>
  `<span class="badge ${k === "empty_cache_read" ? "b-canceled" : "b-other"}">${esc(ISSUE_LABEL[k] || k)}</span>`;

function checkRow(c) {
  return `<div class="kv"><span>${c.ok ? "✅" : "❌"} <strong>${esc(c.name)}</strong></span>
    <span style="text-align:right;color:var(--text-2)">${esc(c.detail)} · <span class="mono">${fmt(c.ms)}ms</span></span></div>`;
}

/* Uptime as a human reads it: "3d 4h", not 273600 seconds. */
function uptime(sec) {
  sec = Number(sec || 0);
  const d = Math.floor(sec / 86400), h = Math.floor((sec % 86400) / 3600), m = Math.floor((sec % 3600) / 60);
  return d ? d + "d " + h + "h" : h ? h + "h " + m + "m" : m + "m";
}

const alertRow = (level, title, detail) =>
  `<div class="alert a-${esc(level)}"><span>${level === "critical" ? "🔴" : level === "warning" ? "🟠" : "🟢"}</span>
    <div><strong>${esc(title)}</strong><span class="a-detail">${esc(detail)}</span></div></div>`;

/* Router backend load. The business panels can't show this: a throttled /check
   answers 200 with a clean no-op, so an overwhelmed server looks like a quiet
   one everywhere except here. Counters are in-process — a restart zeroes them,
   and they describe this instance only. */
let diagTimer = null;
async function routerDiag() {
  const el = $("rdiag");
  if (!el) return;
  let d;
  try { d = await api("/router/admin/diagnostics"); }
  catch (e) { el.innerHTML = `<div class="empty">Router health unavailable: ${esc(e.message)}</div>`; return; }

  const w = d.windows["5m"], now = d.windows["1m"], h = d.host;
  const alerts = d.warnings.length
    ? d.warnings.map((a) => alertRow(a.level, a.title, a.detail)).join("")
    : alertRow("ok", "Keeping up", "No saturation, no dropped redirects and no failing dependency in the last 5 minutes.");

  el.innerHTML = `
    <div class="sec-title" style="margin-top:0">Router · live load <span class="muted" style="font-weight:500">· last 5 min, refreshing</span></div>
    <div class="alerts">${alerts}</div>
    <div class="kpis">
      <div class="kpi"><div class="k-label">Requests / min</div><div class="k-val">${fmt(w.perMinute)}</div>
        <div class="k-sub">${fmt(now.perMinute)} this minute · ${fmt(w.check)} /check in 5min</div></div>
      <div class="kpi"><div class="k-label">Response time</div><div class="k-val">${fmt(w.avgMs)}ms</div>
        <div class="k-sub">worst ${fmt(w.maxMs)}ms · ${fmt(w.slow)} over 1s</div></div>
      <div class="kpi"><div class="k-label">Event-loop lag</div><div class="k-val">${fmt(w.lagMaxMs)}ms</div>
        <div class="k-sub">avg ${fmt(w.lagAvgMs)}ms · time spent unable to answer</div></div>
      <div class="kpi"><div class="k-label">CPU</div><div class="k-val">${fmt(w.cpuPercent)}%</div>
        <div class="k-sub">of one core · ${fmt(d.process.rssMb)}MB resident</div></div>
      <div class="kpi"><div class="k-label">VPS load</div><div class="k-val">${Number(h.load1).toFixed(2)}</div>
        <div class="k-sub">${fmt(h.cores)} cores · ${fmt(h.freeMemMb)}MB free of ${fmt(h.totalMemMb)}MB</div></div>
    </div>
    <div class="grid-eq" style="margin-bottom:16px">
      <div class="panel"><h3>Health</h3>
        ${d.checks.map(checkRow).join("")}
        <p class="note">Up ${uptime(d.process.uptimeSeconds)} · node ${esc(d.process.node)} · read ${dt(d.at)}</p></div>
      <div class="panel"><h3>Load by window</h3>
        <div class="tablewrap"><table><thead><tr>
          <th>Window</th><th class="right">Req</th><th class="right">/check</th><th class="right">Throttled</th>
          <th class="right">429</th><th class="right">5xx</th><th class="right">Avg</th>
        </tr></thead><tbody>${["1m", "5m", "60m"].map((k) => {
          const x = d.windows[k];
          return `<tr><td>${k}</td><td class="right">${fmt(x.requests)}</td><td class="right">${fmt(x.check)}</td>
            <td class="right">${x.checkThrottled ? `<strong style="color:var(--amber)">${fmt(x.checkThrottled)}</strong>` : "0"}</td>
            <td class="right">${fmt(x.rateLimited)}</td><td class="right">${fmt(x.serverErrors)}</td>
            <td class="right">${fmt(x.avgMs)}ms</td></tr>`;
        }).join("")}</tbody></table></div>
        <p class="note">Throttled = a visitor's /check refused by the ${fmt(d.limits.checkRateLimitPerMinute)}/min per-IP cap and answered with a silent no-op: their redirect never ran. Counters reset when the container restarts.</p></div>
    </div>`;
}

/* ── Website traffic ───────────────────────────────────────────────────────────
   vanssay.net's own readers, from the beacon in assets/track.js. Owner visits
   are dropped at write time (browser opt-out flag + SITE_EXCLUDE_IPS), so what
   lands here is other people. */
let siteDays = 30;
async function renderWebsite() {
  const ranges = [7, 30, 90];
  $("view").innerHTML = `
    <div class="page-head">
      <div><h2>Website</h2><p>Page views on vanssay.net, minus mine. No cookies, no third party — the counters live in our own database.</p></div>
      <div style="display:flex;gap:6px">${ranges.map((n) =>
        `<button class="btn btn-sm ${n === siteDays ? "btn-blue" : "btn-line"}" data-days="${n}">${n}d</button>`).join("")}</div>
    </div>
    <div id="wsite"><div class="empty">Loading…</div></div>`;

  document.querySelectorAll("[data-days]").forEach((b) => b.onclick = () => { siteDays = Number(b.dataset.days); renderWebsite(); });

  let d;
  try { d = await api(`/admin/site-traffic?days=${siteDays}`); }
  catch (e) { $("wsite").innerHTML = `<div class="empty">Traffic unavailable: ${esc(e.message)}</div>`; return; }
  // Suggestions are not traffic, but they come from the same site and belong on
  // the same page. Fetched separately so a failure costs the panel, not the tab.
  let sug = null;
  try { sug = await api("/admin/suggestions?limit=200"); } catch (e) { /* panel says so */ }

  const delta = (now, before) => {
    if (!before) return now ? `first ${siteDays} days with data` : "nothing yet";
    const pc = Math.round(((now - before) / before) * 100);
    return `${pc >= 0 ? "+" : ""}${pc}% vs previous ${siteDays}d`;
  };
  const best = d.daily.reduce((a, b) => (b.views > a.views ? b : a), { day: null, views: 0 });
  const topSource = d.referrers.find((r) => r.host !== "direct");
  const directShare = (() => {
    const total = d.referrers.reduce((s, r) => s + r.views, 0);
    const direct = (d.referrers.find((r) => r.host === "direct") || {}).views || 0;
    return total ? Math.round((direct / total) * 100) : 0;
  })();

  // Label every ~5th day: 90 ticks would be unreadable, and no ticks unreadable too.
  const step = Math.max(1, Math.ceil(d.daily.length / 6));
  const chart = barChart(d.daily.map((x, i) => ({
    v: x.views,
    tip: `${x.day}: ${x.views} views · ${x.visitors} visitors`,
    label: i % step === 0 ? x.day.slice(5) : "",
  })));

  $("wsite").innerHTML = `
    <div class="kpis">
      <div class="kpi hero"><div class="k-label">Page views · ${siteDays}d</div><div class="k-val">${fmt(d.totals.views)}</div>
        <div class="k-sub">${esc(delta(d.totals.views, d.previous.views))}</div></div>
      <div class="kpi"><div class="k-label">Visitors</div><div class="k-val">${fmt(d.totals.visitors)}</div>
        <div class="k-sub">daily unique · ${esc(delta(d.totals.visitors, d.previous.visitors))}</div></div>
      <div class="kpi"><div class="k-label">Busiest day</div><div class="k-val">${fmt(best.views)}</div>
        <div class="k-sub">${best.day ? date(best.day) : "-"}</div></div>
      <div class="kpi"><div class="k-label">Top source</div><div class="k-val" style="font-size:20px">${esc(topSource ? topSource.host : "—")}</div>
        <div class="k-sub">${topSource ? fmt(topSource.views) + " views · " : ""}${directShare}% arrive direct</div></div>
    </div>

    <div class="panel" style="margin-bottom:16px"><h3>Views per day</h3>${chart}</div>

    <div class="grid-eq">
      <div class="panel"><h3>Pages</h3>
        <div class="tablewrap">${d.pages.length ? `<table><thead><tr><th>Path</th><th class="right">Views</th><th class="right">Visitors</th></tr></thead>
          <tbody>${d.pages.map((x) => `<tr><td class="mono truncate">${esc(x.path)}</td><td class="right">${fmt(x.views)}</td><td class="right">${fmt(x.visitors)}</td></tr>`).join("")}</tbody></table>`
          : `<div class="empty">No page views recorded yet.</div>`}</div></div>
      <div class="panel"><h3>Where they came from</h3>
        <div class="tablewrap">${d.referrers.length ? `<table><thead><tr><th>Source</th><th class="right">Views</th></tr></thead>
          <tbody>${d.referrers.map((x) => `<tr><td>${x.host === "direct" ? "<span class=\"muted\">Direct / no referrer</span>" : esc(x.host)}</td><td class="right">${fmt(x.views)}</td></tr>`).join("")}</tbody></table>`
          : `<div class="empty">No referrers recorded yet.</div>`}</div></div>
    </div>

    <p class="note" style="margin-top:14px">Your own visits are excluded: signing into this admin flags the browser permanently (add <span class="mono">?notrack=1</span> to any page to flag another one), and ${d.excludedIps ? fmt(d.excludedIps) + " IP" + (d.excludedIps > 1 ? "s are" : " is") : "no IP is"} excluded server-side via <span class="mono">SITE_EXCLUDE_IPS</span>. Known bots are dropped too. "Visitors" counts once per day per person — the id is salted and rebuilt daily, so nobody is followed across days.</p>

    ${suggestionsPanel(sug)}`;
}


/* "Suggest a plugin" answers from vanssay.net — the only place people who never
   signed up get to tell us what is missing. */
const SUGGEST_PLATFORM_LABELS = { framer: "Framer", webflow: "Webflow", both: "Both", other: "Other / not sure", unsaid: "Not said" };

function bindCache(p) {
  const purge = async (all) => {
    try { const r = await api(p.base + "/admin/cache/purge" + (all?"?all=1":""), { method:"POST" });
      $("c-ok").textContent = `Deleted ${r.deleted} entr${r.deleted===1?"y":"ies"}.`; $("c-ok").style.display = "block";
      setTimeout(() => switchTab("prod:" + p.key), 900); }
    catch(e){ $("c-err").textContent = e.message; $("c-err").style.display = "block"; }
  };
  if ($("c-expired")) $("c-expired").onclick = () => purge(false);
  if ($("c-all")) $("c-all").onclick = () => { if (confirm("Delete the entire cache?")) purge(true); };
}

/* Reviews */
let pagesSort = "poweredClicks";
let reviewsUsers = { search: "", page: 1, pageSize: 25 };
// Client-side paginated table (small, real-world account counts): fetch one
// large page from Accounts, keep only users actually using this product, then
// slice locally. Reviews' own /users response already carries businesses/views,
// so "active" = paid, or free with something connected — same rule the global
// Users tab uses per plugin.
function pageSlice(rows, state, wrapId, pagerId, renderRow) {
  const filtered = state.search ? rows.filter((u) => u.email.toLowerCase().includes(state.search.toLowerCase())) : rows;
  const wrap = $(wrapId), pager = $(pagerId);
  if (!filtered.length) { wrap.innerHTML = `<div class="empty">No users found.</div>`; if (pager) pager.innerHTML = ""; return; }
  const pages = Math.max(1, Math.ceil(filtered.length / state.pageSize));
  state.page = Math.min(state.page, pages);
  const start = (state.page - 1) * state.pageSize;
  const slice = filtered.slice(start, start + state.pageSize);
  return { filtered, pages, slice };
}
async function loadReviewsUsers() {
  const wrap = $("rv-utable"); if (!wrap) return;
  let d;
  try { d = await acct("/users?pageSize=1000", null, "reviews"); }
  catch (e) { wrap.innerHTML = `<div class="empty">Couldn't load users: ${esc(e.message)}</div>`; if ($("rv-upager")) $("rv-upager").innerHTML = ""; return; }
  const active = d.users.filter((u) => u.plan !== "free" || u.businesses > 0 || u.viewsThisMonth > 0);
  const r = pageSlice(active, reviewsUsers, "rv-utable", "rv-upager");
  if (!r) return;
  wrap.innerHTML = `<table><thead><tr>
      <th>Email</th><th>Plan</th><th>Platform</th><th class="right">Views / quota</th><th class="right">Businesses</th><th>Joined</th>
    </tr></thead><tbody>${r.slice.map((u) => `<tr class="clickable" data-id="${u.id}">
      <td>${esc(u.email)}</td>
      <td>${planBadge(u.plan)}</td>
      <td>${platformBadge(u.platform)}</td>
      <td class="right">${fmt(u.viewsThisMonth)}${u.quota>0?" / "+fmt(u.quota):" / ∞"}</td>
      <td class="right">${fmt(u.businesses)}</td>
      <td>${date(u.createdAt)}</td>
    </tr>`).join("")}</tbody></table>`;
  wrap.querySelectorAll("tr.clickable").forEach((r) => r.onclick = () => openUser(r.dataset.id, "reviews"));
  $("rv-upager").innerHTML = `<span>${r.filtered.length} user(s) · page ${reviewsUsers.page}/${r.pages}</span>
    <button class="btn btn-line btn-sm" ${reviewsUsers.page<=1?"disabled":""} id="rv-prev">← Prev</button>
    <button class="btn btn-line btn-sm" ${reviewsUsers.page>=r.pages?"disabled":""} id="rv-next">Next →</button>`;
  if ($("rv-prev")) $("rv-prev").onclick = () => { reviewsUsers.page--; loadReviewsUsers(); };
  if ($("rv-next")) $("rv-next").onclick = () => { reviewsUsers.page++; loadReviewsUsers(); };
}

function igFunnelPanel(f, r) {
  if (!f) return `<div class="panel">${unavailable("Funnel", r)}</div>`;
  const top = f.steps.length ? f.steps[0].visitors : 0;
  const rows = f.steps.map((st, i) => {
    const meta = IG_STEP[st.step] || [st.step, ""];
    const pctTop = top ? Math.round((st.visitors / top) * 100) : 0;
    const from = st.fromPrevious === null ? "" :
      `<span class="${st.fromPrevious < 50 ? "bad" : "good"}">${st.fromPrevious}% of previous</span>`;
    const lost = i && st.droppedHere ? ` · ${fmt(st.droppedHere)} lost here` : "";
    return `<div style="margin-bottom:12px">
      <div class="kv" style="border:none;padding-bottom:3px">
        <span title="${esc(meta[1])}">${i + 1}. ${esc(meta[0])}</span>
        <strong>${fmt(st.visitors)} <span class="muted-sm">${from}${lost}</span></strong>
      </div>
      <div class="meter"><span style="width:${pctTop}%"></span></div></div>`;
  }).join("");
  const paying = f.paying || 0;
  const accounts = f.accounts || 0;
  const conv = top ? ((paying / top) * 100).toFixed(1) : "0";
  const signup = top ? ((accounts / top) * 100).toFixed(1) : "0";
  return `<div class="panel"><h3>Funnel · last ${f.days} days</h3>${rows}
    <div class="kv" style="margin-top:10px"><span>Open → account</span><strong>${signup}%</strong></div>

    <div class="kv"><span>On Free right now</span><strong>${fmt(Math.max(0, accounts - paying))}</strong></div>
    <div class="kv"><span>Previews that failed</span><strong>${fmt(f.failed)}</strong></div></div>`;
}

}

        plan: $("gift-plan").value,
        months: Number($("gift-months").value),
        count: Number($("gift-count").value) || 1,
        note: $("gift-note").value.trim() || undefined,
      } }, "instagram");
      // Show them before the re-render so a bulk batch can be copied in one go.
      out.innerHTML = `<b>${r.codes.length} code${r.codes.length > 1 ? "s" : ""}:</b> <span class="mono">${r.codes.map(esc).join("  ")}</span>`;
      const keep = out.innerHTML;
      await renderInstagram(head);
      if ($("gift-out")) $("gift-out").innerHTML = keep;
    } catch (e) { out.textContent = e.message; }
    finally { if ($("gift-gen")) $("gift-gen").disabled = false; }
  };
  if ($("reach-scan")) $("reach-scan").onclick = async () => {
    const btn = $("reach-scan"), out = $("reach-out");
    btn.disabled = true; if (out) out.textContent = "Scanning…";
    try {
      const r = await api("/instagram/admin/outreach/scan", { method: "POST", body: {} });
      if (out) out.textContent = `Queued ${r.queued}, skipped ${r.skipped} as test handles.`;
      const keep = out ? out.textContent : "";
      await renderInstagram(head);
      if ($("reach-out")) $("reach-out").textContent = keep;
    } catch (e) { if (out) out.textContent = e.message; }
    finally { if ($("reach-scan")) $("reach-scan").disabled = false; }
  };
  document.querySelectorAll(".reach-copy").forEach((b) => {
    b.onclick = async () => {
      try { await navigator.clipboard.writeText(b.dataset.msg); b.textContent = "Copied"; setTimeout(() => { b.textContent = "Copy"; }, 1500); }
      catch { alert(b.dataset.msg); } // clipboard blocked → show it so it can still be copied by hand
    };
  });
  document.querySelectorAll(".reach-set").forEach((b) => {
    b.onclick = async () => {
      b.disabled = true;
      try { await api("/instagram/admin/outreach/" + encodeURIComponent(b.dataset.id), { method: "POST", body: { status: b.dataset.status } }); await renderInstagram(head); }
      catch (e) { alert(e.message); b.disabled = false; }
    };
  });
  document.querySelectorAll(".gift-del").forEach((b) => {
    b.onclick = async () => {
      if (!confirm("Revoke this unused code? It can no longer be redeemed.")) return;
      b.disabled = true;
      try { await acct("/gift-codes/" + encodeURIComponent(b.dataset.token), { method: "DELETE" }, "instagram"); await renderInstagram(head); }
      catch (e) { alert(e.message); b.disabled = false; }
    };
  });
}

boot();
</script>
</body>
</html>
