  paint(ctx, `${pageHead({ title: hello, sub: `${today}. Here is how Vanssay is doing.` })}
    <div id="h-kpis">${skel.kpis(6)}</div>
    <div class="grid g21 mb">
      ${card({ title: "Money in · last 30 days", info: MONEY_INFO, act: cardLink("#/revenue", "Revenue"), body: `<div id="h-sales">${skel.card(258)}</div>` })}
      ${card({ title: "Needs attention", act: `<span id="h-att-n"></span>`, flush: true, body: `<div id="h-att">${skel.lines(6)}</div>` })}
    </div>
    ${sec("Products")}
    <div id="h-prods" class="grid mb" style="grid-template-columns:repeat(auto-fill,minmax(228px,1fr))">${skel.card(176).repeat(5)}</div>
    <div class="grid g21">
      ${card({ title: "New accounts · last 12 months", info: "<p>Every plugin shares one account base, so this counts each person once, whichever plugin they signed up from.</p>", act: cardLink("#/users", "Users"), body: `<div id="h-signups">${skel.card(200)}</div>` })}
      ${card({ title: "Mix", body: `<div id="h-mix">${skel.lines(6)}</div>` })}
    </div>`);

  const ovP = overviews(), domP = domainOverviews(), cmpP = componentsData();
  const s62P = get("/admin/sales?days=62");

  region(ctx, "h-kpis", async () => {
    const [rs, cmp, s62] = await Promise.all([ovP, cmpP, s62P.then((x) => x, () => null)]);
    const bills = PRODUCTS.map((p, i) => val(rs[i])).filter(Boolean);
    if (!bills.length) throw new Error("Accounts service unavailable: " + why(rs[0]));
    const any = bills[0];
    const mrr = sum(bills, (b) => b.revenue.mrr);
    const paid = sum(bills, (b) => b.plans.paid);
    // Recurring only: a Lifetime buyer has paid, but is subscribed to nothing.
    const subs = sum(bills, (b) => b.plans.starter + b.plans.pro + b.plans.ultra);
    const oneTime = sum(bills, (b) => (b.revenue.lifetimeRevenue || 0) + (b.revenue.addOnRevenue || 0)) + (cmp ? cmp.totals.revenueCents / 100 : 0);
    const oneTimeN = sum(bills, (b) => (b.revenue.lifetimeCount || 0) + (b.revenue.addOnCount || 0)) + (cmp ? cmp.totals.sales : 0);
    const gifted = sum(bills, (b) => b.plans.gifted || 0);
    const sg = any.signups || [];
    const lastMonthSignups = sg.length > 1 ? sg[sg.length - 2].count : 0;
    const pace = s62 ? monthPace(s62) : null;
    return kpis([
      { label: "Monthly recurring", value: money(mrr), sub: `${money(mrr * 12)} a year`, info: MRR_INFO, hero: true },
      s62 ? { label: "Collected this month", value: moneyCents(s62.thisMonth.cents), href: "#/revenue",
        delta: delta(pace.now, pace.then, { vs: "vs the same days last month" }),
        sub: `vs ${moneyCents(pace.then)} by this day last month`, spark: spark(s62.series.slice(-30).map((b) => b.cents), { c: "--c-accent" }) } : null,
      { label: "One-time revenue", value: money(Math.round(oneTime * 100) / 100), href: "#/revenue", sub: `${plural(oneTimeN, "purchase")}, not recurring` },
      { label: "New accounts this month", value: fmt(any.users.newThisMonth), href: "#/users", delta: delta(any.users.newThisMonth, lastMonthSignups),
        sub: `${fmt(lastMonthSignups)} last month · ${fmt(any.users.total)} total`, spark: spark(sg.map((s) => s.count), { bars: true, c: "--c-accent" }) },
      { label: "Paying subscriptions", value: fmt(subs), href: "#/subscriptions", sub: `+ ${fmt(oneTimeN)} one-time · ${fmt(gifted)} gifted` },
      { label: "Conversion", value: pctOf(paid, any.users.total, 1), sub: "everyone who has paid ÷ accounts" },
    ]);
  });

  region(ctx, "h-sales", async () => {
    const s62 = await s62P;
    const last = { ...s62, series: s62.series.slice(-30), granularity: "day" };
    const ss = salesSeries(last);
    return moneyChart(ss, { height: 286 }) + `<div class="row" style="justify-content:space-between;margin-top:10px;color:var(--muted);font-size:12.5px">
      <span>This month so far <b class="t2">${moneyCents(s62.thisMonth.cents)}</b> · ${plural(s62.thisMonth.count, "payment")}</span>
      <span>Last month <b class="t2">${moneyCents(s62.lastMonth.cents)}</b> · ${plural(s62.lastMonth.count, "payment")}</span></div>
      ${s62.mixedCurrencies ? `<p class="note warn-t" style="margin-top:6px">Invoices in more than one currency are being summed as if they were one.</p>` : ""}`;
  });

  const paintAtt = () => {
    if (!ctx.live()) { document.removeEventListener("attention", paintAtt); return; }
    const el = $("h-att"); if (!el) return;
    el.innerHTML = attentionList(ATTN.items, 5);
    const n = ATTN.items.length;
    $("h-att-n").innerHTML = n ? `<span class="cnt ${ATTN.items.some((x) => x.level === "critical") ? "crit" : ATTN.items.some((x) => x.level === "warning") ? "warn" : ""}">${n}</span>` : "";
  };
  document.addEventListener("attention", paintAtt);
  if (ATTN.loaded) paintAtt();
  loadAttention();

  region(ctx, "h-prods", async () => {
    const [rs, ds, cmp] = await Promise.all([ovP, domP, cmpP]);
    const bills = {}, doms = {};
    PRODUCTS.forEach((p, i) => { bills[p.key] = val(rs[i]); doms[p.key] = val(ds[i]); });
    const rows = {
      reviews: (b, d) => b && b.usage ? [["Businesses", fmt(b.usage.businesses)], ["Widget views · mo", fmt(b.usage.viewsThisMonth)], ["“Powered by” clicks", fmt(b.powered.clicks)]] : [],
      instagram: (b, d) => d ? [["Feeds", fmt(d.feeds)], ["Opened · 30d", d.funnel30d ? fmt(d.funnel30d.opened) : "–"], ["Views · mo", fmt(d.viewsThisMonth)]] : [["Domain data", "unavailable"]],
      geoblock: (b, d) => d ? [["Protected sites", `${fmt(d.configs.total)} <span class="muted">(${fmt(d.configs.vpnEnabled)} VPN)</span>`], ["Blocked · mo", fmt(d.thisMonth.blocked)], ["Checked · mo", fmt(d.thisMonth.visits)]] : [["Domain data", "unavailable"]],
      router: (b, d) => d ? [["Routed sites", `${fmt(d.configs.enabled)} on <span class="muted">/ ${fmt(d.configs.total)}</span>`], ["Redirects · mo", fmt(d.thisMonth.redirected)], ["Checked · mo", fmt(d.thisMonth.visits)]] : [["Domain data", "unavailable"]],
    };
    const cards = PRODUCTS.map((p) => {
      const b = bills[p.key], d = doms[p.key];
      const oneTime = b ? (b.revenue.lifetimeRevenue || 0) + (b.revenue.addOnRevenue || 0) : 0;
      return `<a class="card pcard" href="#/${p.route}" style="--c:var(${p.c})">
        <div class="pt"><span class="pi">${icon(p.icon)}</span>${esc(p.label)}${icon("arrow")}</div>
        <div class="big">${b ? money(b.revenue.mrr) : "–"}<small>MRR</small>${oneTime ? `<small style="margin-left:10px">+ ${money(oneTime)} one-time</small>` : ""}</div>
        ${b ? kv("Paying", `${fmt(b.plans.paid)} <span class="muted">· ${esc(planBreakdown(b.plans, p.key))}</span>`) : kv("Billing", "unavailable")}
        ${rows[p.key](b, d).map(([k, v]) => kv(k, v)).join("")}</a>`;
    });
    const c = cmp && (cmp.components || []).find((x) => x.slug === COMPONENT.slug);
    const opened = c ? c.sales.length + c.abandoned : 0;
    cards.push(`<a class="card pcard" href="#/${COMPONENT.route}" style="--c:var(${COMPONENT.c})">
      <div class="pt"><span class="pi">${icon(COMPONENT.icon)}</span>${esc(COMPONENT.label)}${icon("arrow")}</div>
      <div class="big">${c && !c.unavailable ? moneyCents(c.revenueCents) : "–"}<small>one-time</small></div>
      ${c && !c.unavailable ? kv("Sales", fmt(c.sales.length)) + kv("Checkout conversion", pctOf(c.sales.length, opened)) + kv("Landing views", fmt(c.funnel ? c.funnel.landingViews : 0)) : kv("Stripe", c ? esc(c.unavailable) : "unavailable")}</a>`);
    return cards.join("");
  });

  region(ctx, "h-signups", async () => {
    const rs = await ovP;
    const any = PRODUCTS.map((p, i) => val(rs[i])).find(Boolean);
    if (!any) throw new Error("Accounts service unavailable");
    const sg = any.signups || [];
    return chart({ keys: sg.map((s) => s.month), gran: "month", height: 290, integer: true,
      series: [{ id: "n", label: "New accounts", c: "--c-accent", values: sg.map((s) => s.count) }], empty: "No signups in the last 12 months." });
  });

  region(ctx, "h-mix", async () => {
    const rs = await ovP;
    const bills = {}; PRODUCTS.forEach((p, i) => { bills[p.key] = val(rs[i]); });
    const any = PRODUCTS.map((p) => bills[p.key]).find(Boolean);
    if (!any) throw new Error("Accounts service unavailable");
    const mrr = sum(PRODUCTS, (p) => (bills[p.key] ? bills[p.key].revenue.mrr : 0));
    const src = any.sources || {};
    return `<div class="note" style="margin-bottom:6px">MRR by product</div>
      ${barList(PRODUCTS.filter((p) => bills[p.key]).map((p) => ({ label: esc(p.label), value: bills[p.key].revenue.mrr, display: money(bills[p.key].revenue.mrr), c: p.c, href: "#/" + p.route })), { empty: "No recurring revenue yet." })}
      <div class="kv" style="margin:6px 0 16px"><span>Total</span><span>${money(mrr)} / mo</span></div>
      <div class="note" style="margin-bottom:6px">Where accounts signed up</div>
      ${barList([["framer", "Framer"], ["webflow", "Webflow"], ["web", "Instagram web app"]].filter(([k]) => src[k] !== undefined).map(([k, l]) => ({ label: l, value: src[k] || 0 })), { c: "--c-accent" })}`;
  });
}

/* ── Users ─────────────────────────────────────────────────────────────────── */
async function pageUsers(ctx) {
  const q = ctx.r.q;
  const [rs, acts] = await Promise.all([
    Promise.allSettled(PRODUCTS.map((p) => acct("/users?pageSize=1000", p.key))),
    Promise.allSettled(PRODUCTS.map((p) => (p.activity ? get(p.base + p.activity[0]) : Promise.resolve(null)))),
  ]);
  if (!ctx.live()) return;
  const base = val(rs[0]);
  if (!base) throw new Error(why(rs[0]) || "Users unavailable");
  const planOf = {}, activeIds = {};
  PRODUCTS.forEach((p, i) => {
    const d = val(rs[i]);
    planOf[p.key] = new Map((d ? d.users : []).map((u) => [u.id, u]));
    const sd = val(acts[i]), list = sd && p.activity ? sd[p.activity[1]] : null;
    activeIds[p.key] = new Set(Array.isArray(list) ? list.map((x) => x.userId).filter(Boolean) : []);
  });
  // "Actively using" = paid on that plugin, or free with something to show for
  // it there: a site config, an Instagram feed, or (Reviews) businesses and
  // views. The free signal is capped by each backend's own list size (feeds
  // take 200, sites 500), so a very old free account can age out of its badge.
  const users = base.users.map((u) => {
    const prods = PRODUCTS.map((p) => {
      const row = planOf[p.key].get(u.id) || { plan: "free" };
      const active = row.plan !== "free" || (p.key === "reviews" ? (u.businesses || 0) > 0 || (u.viewsThisMonth || 0) > 0 : activeIds[p.key].has(u.id));
      return active ? { p, plan: row.plan, billing: row.billing } : null;
    }).filter(Boolean);
    return { ...u, prods, paying: prods.some((x) => x.plan !== "free") };
  });
  palUsers = base.users;
  const mk = todayKey().slice(0, 7);
  const newThisMonth = users.filter((u) => monthKeyOf(u.createdAt) === mk).length;
  const active = users.filter((u) => u.prods.length).length;
  const paying = users.filter((u) => u.paying).length;
  const byMonth = new Map(); users.forEach((u) => { const k = monthKeyOf(u.createdAt); byMonth.set(k, (byMonth.get(k) || 0) + 1); });
  const months = []; { const d = new Date(); d.setUTCDate(1); for (let i = 11; i >= 0; i--) { const x = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() - i, 1)); months.push(x.toISOString().slice(0, 7)); } }

  const state = { platform: q.get("platform") || "", product: q.get("product") || "", status: q.get("status") || "" };
  const filtered = () => users.filter((u) =>
    (!state.platform || (u.platform || "framer") === state.platform) &&
    (!state.product || (state.product === "none" ? !u.prods.length : u.prods.some((x) => x.p.key === state.product))) &&
    (!state.status || (state.status === "paying" ? u.paying : state.status === "free" ? u.prods.length && !u.paying : !u.prods.length)));
  let tApi = null;
  const opt = (v, l, cur) => `<option value="${v}" ${cur === v ? "selected" : ""}>${esc(l)}</option>`;
  const tools = `<select class="in" data-f="platform" aria-label="Platform">${opt("", "All platforms", state.platform)}${opt("framer", "Framer", state.platform)}${opt("webflow", "Webflow", state.platform)}${opt("web", "Web app", state.platform)}</select>
    <select class="in" data-f="product" aria-label="Product">${opt("", "Any product", state.product)}${PRODUCTS.map((p) => opt(p.key, "Uses " + p.label, state.product)).join("")}${opt("none", "Not active anywhere", state.product)}</select>
    <select class="in" data-f="status" aria-label="Status">${opt("", "Everyone", state.status)}${opt("paying", "Paying", state.status)}${opt("free", "Active on Free", state.status)}${opt("inactive", "Not active", state.status)}</select>`;
  paint(ctx, `${pageHead({ title: "Users", sub: "Every account, where it signed up and which plugins it actually uses. Click one for the full picture and the overrides." })}
    ${kpis([
      { label: "Accounts", value: fmt(users.length), sub: `${fmt(newThisMonth)} new this month`, spark: spark(months.map((m) => byMonth.get(m) || 0), { bars: true }) },
      { label: "Active in a plugin", value: fmt(active), sub: pctOf(active, users.length) + " of accounts" },
      { label: "Paying", value: fmt(paying), sub: pctOf(paying, users.length, 1) + " of accounts, any plugin" },
      { label: "Signed up on", value: `${fmt(users.filter((u) => (u.platform || "framer") === "framer").length)}<small>Framer</small>`,
        sub: `${fmt(users.filter((u) => u.platform === "webflow").length)} Webflow · ${fmt(users.filter((u) => u.platform === "web").length)} web app` },
    ])}
    ${card({ flush: true, body: table({
      rows: filtered(), noun: "accounts", searchPh: "Search by email…", search: (u) => u.email, q: q.get("q") || "", tools, csv: "vanssay-users.csv",
      sort: { key: "createdAt", dir: "desc" }, onRow: (u) => openUser(u.id), ref: (a) => { tApi = a; },
      bind: (el) => {
        el.querySelectorAll("[data-f]").forEach((s) => s.addEventListener("change", () => { state[s.dataset.f] = s.value; setQuery({ [s.dataset.f]: s.value }); tApi.setRows(filtered()); }));
        const inp = el.querySelector("input[type=search]"); let tm;
        if (inp) inp.addEventListener("input", () => { clearTimeout(tm); tm = setTimeout(() => setQuery({ q: inp.value.trim() }), 400); });
      },
      cols: [
        { key: "email", label: "Email", v: (u) => `<strong>${esc(u.email)}</strong>` },
        { key: "platform", label: "Platform", v: (u) => platformBadge(u.platform), csv: (u) => platformLabel(u.platform) },
        { key: "prods", label: "Actively using", sort: (u) => u.prods.length * 10 + (u.paying ? 5 : 0), first: "desc",
          v: (u) => u.prods.length ? `<div class="bdgs">${u.prods.map((x) => `<span class="pc${x.plan !== "free" ? " paid" : ""}" style="--c:var(${x.p.c})" title="${esc(x.p.label)} · ${esc(isLifetime(x.billing) ? "Lifetime" : tierLabel(x.plan, x.p.key))}"><i></i>${esc(x.p.label)}${x.plan !== "free" ? `<small>${esc(isLifetime(x.billing) ? "Lifetime" : tierLabel(x.plan, x.p.key))}</small>` : ""}</span>`).join("")}</div>` : `<span class="muted">Not active yet</span>`,
          csv: (u) => u.prods.map((x) => x.p.label + (x.plan !== "free" ? " (" + x.plan + ")" : "")).join("; ") },
        { key: "createdAt", label: "Joined", v: (u) => `${date(u.createdAt)}<span class="sub">${ago(u.createdAt)}</span>`, csv: (u) => u.createdAt },
      ],
    }) })}
    ${base.total > base.users.length ? `<p class="note" style="margin-top:10px">Showing the newest ${fmt(base.users.length)} of ${fmt(base.total)} accounts.</p>` : ""}`);
}

/* ── Revenue ───────────────────────────────────────────────────────────────── */
async function pageRevenue(ctx) {
  const range = ["30", "90", "12m", "all"].includes(ctx.r.q.get("range")) ? ctx.r.q.get("range") : "all";
  const [d, s62, rs, cmp] = await Promise.all([get(salesPath(range)), get("/admin/sales?days=62").then((x) => x, () => null), overviews(), componentsData()]);
  if (!ctx.live()) return;
  const bills = {}; PRODUCTS.forEach((p, i) => { bills[p.key] = val(rs[i]); });
  const ok = PRODUCTS.filter((p) => bills[p.key]);
  const mrr = sum(ok, (p) => bills[p.key].revenue.mrr);
  const c = cmp && (cmp.components || []).find((x) => x.slug === COMPONENT.slug);
  const life = ok.filter((p) => bills[p.key].revenue.lifetimeRevenue).map((p) => ({ label: `${esc(p.label)} Lifetime`, sub: plural(bills[p.key].revenue.lifetimeCount, "licence"), value: bills[p.key].revenue.lifetimeRevenue, display: money(bills[p.key].revenue.lifetimeRevenue), c: p.c }));
  const adds = ok.filter((p) => bills[p.key].revenue.addOnRevenue).map((p) => ({ label: `${esc(p.label)} extra feeds`, sub: plural(bills[p.key].revenue.addOnCount, "slot"), value: bills[p.key].revenue.addOnRevenue, display: money(bills[p.key].revenue.addOnRevenue), c: p.c }));
  const comps = c && c.revenueCents ? [{ label: esc(COMPONENT.label), sub: plural(c.sales.length, "sale"), value: c.revenueCents / 100, display: moneyCents(c.revenueCents), c: COMPONENT.c, href: "#/" + COMPONENT.route }] : [];
  const oneTimeRows = [...life, ...adds, ...comps].sort((x, y) => y.value - x.value);
  const oneTime = sum(oneTimeRows, (r) => r.value);
  const ss = salesSeries(d);
  const win = range === "all" ? "all time" : range === "12m" ? "last 12 months" : `last ${range} days`;
  const pace = s62 ? monthPace(s62) : null;
  const per = ss.gran === "week" ? "week" : ss.gran === "month" ? "month" : "day";
  paint(ctx, `${pageHead({ title: "Revenue", sub: "Money that actually came in, by product, next to what recurs.",
      ctl: seg("range", [["30", "30 days"], ["90", "90 days"], ["12m", "12 months"], ["all", "All time"]], range) })}
    ${d.mixedCurrencies ? alertBox("warning", "More than one currency", "Invoices in different currencies are summed as if they were one. Check the Invoices page.") : ""}
    ${kpis([
      { label: `Collected · ${win}`, value: moneyCents(d.totals.cents), sub: `${plural(d.totals.count, "payment")} · ${plural(d.totals.buyers, "buyer")}`, info: MONEY_INFO, hero: true },
      s62 ? { label: "This month so far", value: moneyCents(pace.now), delta: delta(pace.now, pace.then), sub: `${moneyCents(s62.lastMonth.cents)} all of last month` } : null,
      { label: "Monthly recurring", value: money(mrr), sub: `${money(mrr * 12)} a year`, info: MRR_INFO },
      { label: "One-time, all time", value: money(Math.round(oneTime * 100) / 100), sub: "Lifetime, extra feeds, components" },
      { label: "Average payment", value: d.totals.count ? moneyCents(d.totals.cents / d.totals.count) : "–", sub: win },
    ])}
    ${card({ title: `Money in, per ${per}`, sub: ss.gran === "week" && d.granularity === "day" ? "grouped by week to stay readable" : "", info: MONEY_INFO, cls: "mb", body: moneyChart(ss, { height: 280, legendTotals: true }) })}
    ${card({ title: d.allTime ? "Collected to date" : "Running total over this window", sub: d.allTime && d.firstSale ? "since the first sale on " + date(d.firstSale) : "", cls: "mb", body: cumulativeChart(ss, 190) })}
    <div class="grid g2">
      ${card({ title: "Monthly recurring by product", info: MRR_INFO, body: barList(ok.map((p) => ({ label: esc(p.label), sub: planBreakdown(bills[p.key].plans, p.key), value: bills[p.key].revenue.mrr, display: money(bills[p.key].revenue.mrr) + "/mo", c: p.c, href: "#/" + p.route })).sort((x, y) => y.value - x.value), { empty: "No recurring revenue yet." })
        + `<div class="kv" style="margin-top:8px"><span>Total</span><span>${money(mrr)} / mo · ${money(mrr * 12)} / yr</span></div>`, foot: `${fmt(ok.length)} of ${fmt(PRODUCTS.length)} billing services answered.` })}
      ${card({ title: "One-time revenue", info: "<p>Valued per sale at the cash the buyer's invoice records, not at today's list price. Never added to MRR: it does not recur.</p>", body: barList(oneTimeRows, { empty: "No one-time sales yet." })
        + `<div class="kv" style="margin-top:8px"><span>Total</span><span>${money(Math.round(oneTime * 100) / 100)}</span></div>` })}
    </div>`);
  onSeg(ctx.view, "range", (v) => { setQuery({ range: v === "all" ? null : v }); rerender(); });
}

/* ── Subscriptions ─────────────────────────────────────────────────────────── */
async function pageSubscriptions(ctx) {

  const [rs, users] = await Promise.all([
    Promise.allSettled(list.map((p) => acct("/subscriptions", p.key))),
    get("/admin/users?pageSize=1000").then((x) => x.users, () => []),
  ]);
  if (!ctx.live()) return;
  const idOf = new Map(users.map((u) => [u.email, u.id]));
  const all = [];
  list.forEach((p, i) => { const d = val(rs[i]); if (d) d.subscriptions.forEach((s) => all.push({ ...s, product: p })); });
  const failed = list.filter((p, i) => !val(rs[i]));
  const live = all.filter((s) => s.live);
  const mrr = sum(live, (s) => s.monthlyValue);
  const lifetimes = all.filter((s) => s.lifetime && (s.status === "active" || s.status === "trialing"));
  const canceled = all.filter((s) => s.status === "canceled").length;
  const rows = scope === "live" ? all.filter((s) => s.live || (s.lifetime && s.status === "active")) : all;
  const byKey = (arr, f) => { const m = new Map(); arr.forEach((x) => { const k = f(x); m.set(k, (m.get(k) || 0) + 1); }); return m; };

// Gaps in the series that are known and deliberate, so the check below does not
// cry wolf over them. The legal record is the invoice table itself.
const KNOWN_INVOICE_GAPS = { "2026-124": "Deleted duplicate of 2026-123 (3 Oct 2026). Left as a gap on purpose; do not renumber." };
function seriesGaps(invoices) {
  const byYear = new Map();
  for (const inv of invoices) { const m = /^(\d{4})-(\d+)$/.exec(String(inv.number)); if (m) { const y = m[1]; if (!byYear.has(y)) byYear.set(y, []); byYear.get(y).push(Number(m[2])); } }
  const gaps = [];
  for (const [y, nums] of byYear) {
    const set = new Set(nums), lo = Math.min(...nums), hi = Math.max(...nums), w = String(invoices.find((i) => String(i.number).startsWith(y + "-")).number).split("-")[1].length;
    for (let n = lo; n <= hi; n++) if (!set.has(n)) gaps.push(`${y}-${String(n).padStart(w, "0")}`);
  }
  return gaps;
}
async function pageInvoices(ctx) {
  const q0 = ctx.r.q.get("q") || "";

  const held = inv.filter((x) => x.blocked).length;
  const gaps = q0 ? [] : seriesGaps(inv);
  const unknown = gaps.filter((g) => !KNOWN_INVOICE_GAPS[g]);
  const byMonth = rollup(inv.filter((x) => x.supplyDate), (x) => monthKeyOf(x.supplyDate), (acc, x, k) => { acc = acc || { key: k, cents: 0, n: 0 }; acc.cents += x.amountCents; acc.n += 1; return acc; }).sort((a, b) => a.key.localeCompare(b.key));
  paint(ctx, `${pageHead({ title: "Invoices", sub: "Every invoice issued, across all products. The series is continuous by law: numbers are allocated when a payment lands and never reused.",
      ctl: `<label class="srch">${icon("search")}<input class="in" id="inv-q" type="search" placeholder="Number, email or name…" value="${esc(q0)}" aria-label="Search invoices" /></label>` })}
    ${kpis([
      { label: q0 ? "Matching invoices" : "Invoices issued", value: fmt(q0 ? inv.length : d.total), sub: q0 ? `of ${fmt(d.total)} in the series` : inv.length < d.total ? `showing the newest ${fmt(inv.length)}` : "all shown" },
      { label: q0 ? "Amount, matching" : "Amount, shown", value: usdOnly ? moneyCents(sum(inv, (x) => x.amountCents)) : "Mixed", sub: usdOnly ? "as invoiced, USD" : "several currencies, not summed" },
      { label: "Held", value: fmt(held), sub: "waiting on the intracom VAT number" },
      { label: "Without an account", value: fmt(inv.filter((x) => x.accountLess).length), sub: "component sales" },
    ])}
    ${!q0 && inv.length ? `<div class="grid g21 mb">
      ${card({ title: "Invoiced per month", sub: `the ${fmt(inv.length)} invoices shown, by paid date`, body: chart({ keys: byMonth.map((m) => m.key), gran: "month", height: 170,
        series: [{ id: "a", label: "Invoiced", c: "--c-accent", values: byMonth.map((m) => m.cents) }], fmt: moneyCents, axis: centsAxis, extra: (i) => [["Invoices", fmt(byMonth[i].n)]] }) })}
      ${card({ title: "Series check", body: unknown.length
        ? alertBox("critical", `${plural(unknown.length, "number")} missing`, unknown.join(", ") + ". A gap in the series has to be explained.")
        : alertBox("ok", "No unexplained gap", `Continuous across the ${fmt(inv.length)} newest invoices.`)
        + gaps.filter((g) => KNOWN_INVOICE_GAPS[g]).map((g) => `<p class="note" style="margin-top:10px"><b>${esc(g)}</b> · ${esc(KNOWN_INVOICE_GAPS[g])}</p>`).join("") })}
    </div>` : ""}
    ${card({ flush: true, body: table({
      rows: inv, noun: "invoices", csv: "vanssay-invoices.csv", sort: { key: "number", dir: "desc" }, page: 50,

        { key: "buyerName", label: "Buyer", sort: (x) => (x.buyerName || x.buyerEmail || "").toLowerCase(), csv: (x) => x.buyerName || "",
          v: (x) => `${esc(x.buyerName || "–")}<span class="sub">${esc(x.buyerEmail || "")}${x.buyerCountry ? " · " + esc(x.buyerCountry) : ""}</span>` },
        { key: "buyerEmail", label: "Buyer email", hide: true },
        { key: "product", label: "Product", v: (x) => esc(x.product) + (x.accountLess ? `<span class="sub">no account</span>` : "") },
        { key: "issuedAt", label: "Issued", v: (x) => date(x.issuedAt), csv: (x) => x.issuedAt },

/* ── Costs (Apify) ─────────────────────────────────────────────────────────── */
async function pageCosts(ctx) {
  // Reviews reads Apify's own settled cost per run; Instagram computes it from the
  // per-item price (its scrape uses the sync endpoint, which never returns the run
  // object). Both are shown, and the estimate is labelled as one.
  const rs = await Promise.allSettled([get("/admin/expenses"), get("/instagram/admin/expenses")]);
  if (!ctx.live()) return;
  const [rev, ig] = rs.map(val);
  if (!rev && !ig) throw new Error(why(rs[0]) || "Expenses unavailable");
  const bp = Object.fromEntries(((rev && rev.month.byPlatform) || []).map((x) => [x.platform, x]));
  const z = { cost: 0, items: 0, requests: 0 };
  const tp = bp.trustpilot || z, gg = bp.google || z;
  const ba = Object.fromEntries(((ig && ig.month.byActor) || []).map((x) => [x.actor, x]));
  const igProf = ba.profile || z, igPost = ba.post || z;
  const revMonth = rev ? rev.month.total : 0, igMonth = ig ? ig.month.total : 0, total = revMonth + igMonth;
  // Apify bills 16th → 15th. Once both backends report that window, "this month"
  // means the cycle and it can be measured against the plan's cap.
  const cycleAligned = !!(rev && rev.month.from && ig && ig.month.from);
  const cm = (rev && rev.month.from ? rev.month : null) || (ig && ig.month.from ? ig.month : null);
  const cycleDay = (s) => dayMon(keyDate(s), true);
  const cycle = cm ? `${cycleDay(cm.from)} – ${cycleDay(cm.to)}` : "";
  const allTime = (rev ? rev.allTime.cost : 0) + (ig ? ig.allTime.cost : 0);
  const allReq = (rev ? rev.allTime.requests : 0) + (ig ? ig.allTime.requests : 0);
  const series = new Map();
  const addM = (list, f) => (list || []).forEach((m) => { const row = series.get(m.month) || { month: m.month, tp: 0, gg: 0, prof: 0, post: 0, rev: 0, ig: 0 }; f(row, m); series.set(m.month, row); });
  addM(rev && rev.months, (row, m) => { row.tp += m.trustpilot || 0; row.gg += m.google || 0; row.rev += m.total || 0; });
  addM(ig && ig.months, (row, m) => { row.prof += m.profile || 0; row.post += m.post || 0; row.ig += m.total || 0; });
  const months = [...series.values()].sort((a, b) => a.month.localeCompare(b.month));
  const capPct = (total / APIFY_CYCLE_CAP) * 100;
  const recent = [
    ...((rev && rev.recent) || []).map((r) => ({ when: r.createdAt, plugin: "Reviews", kind: r.platform, source: r.sourceId, items: r.items, cost: r.cost, status: r.status, exact: true })),
    ...((ig && ig.recent) || []).map((r) => ({ when: r.createdAt, plugin: "Instagram", kind: r.actor, source: "@" + r.handle, items: r.items, cost: r.cost, status: "SUCCEEDED", exact: false })),
  ].sort((a, b) => new Date(b.when) - new Date(a.when)).slice(0, 300);
  const SRC = { trustpilot: "Trustpilot", google: "Google", profile: "IG profile", post: "IG posts" };
  const periodWord = cycleAligned ? "this cycle" : "this month";
  paint(ctx, `${pageHead({ title: "Costs", sub: "Everything paid to Apify for scraping, across every plugin. Cache misses only: a cached widget load is free." })}
    ${kpis([
      { label: `Spend · ${periodWord}`, value: usd(total), hero: true, sub: cycle ? `${esc(cycle)} · ${plural(tp.requests + gg.requests + igProf.requests + igPost.requests, "paid scrape")}` : plural(tp.requests + gg.requests + igProf.requests + igPost.requests, "paid scrape") },
      { label: `Reviews · ${periodWord}`, value: usd(revMonth), c: "--c-reviews", sub: `${plural(tp.requests + gg.requests, "scrape")} · ${plural(tp.items + gg.items, "review")}` },
      { label: `Instagram · ${periodWord}`, value: ig ? usd(igMonth) : "–", c: "--c-instagram", sub: ig ? `${plural(igProf.requests + igPost.requests, "scrape")} · ${plural(igProf.items + igPost.items, "item")}` : "unavailable" },
      { label: "All-time spend", value: usd(allTime), sub: plural(allReq, "scrape") + " in total" },
      ig ? { label: "IG scrapes today", value: fmt(ig.scrapesToday), sub: "against the daily budget" } : null,
    ])}
    <div class="grid g21 mb">
      ${card({ title: cycleAligned ? "Spend per Apify cycle" : "Spend per month", sub: cycleAligned ? "16th → 15th · last 12" : "last 12 months",
        body: chart({ keys: months.map((m) => m.month), gran: "month", height: 230, fmt: (v) => usd(v), axis: (v) => "$" + (v < 10 ? Number(v.toFixed(2)).toString() : compact(v)),
          xfmt: cycleAligned ? (k, full) => { const d0 = keyDate(k); const d1 = new Date(Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth() + 1, 15)); return full ? `${cycleDay(k + "-16")} – ${dueDate(d1.toISOString())}` : xAxisLabel(k, "month"); } : null,
          series: [{ id: "rev", label: "Reviews", c: "--c-reviews", values: months.map((m) => m.rev) }, { id: "ig", label: "Instagram", c: "--c-instagram", values: months.map((m) => m.ig) }],
          extra: (i) => { const m = months[i]; return [m.tp || m.gg ? ["Trustpilot · Google", `${usd(m.tp)} · ${usd(m.gg)}`] : null, m.prof || m.post ? ["IG profile · posts", `${usd(m.prof)} · ${usd(m.post)}`] : null]; },
          empty: "No paid scrape in the last 12 months." }) })}
      ${card({ title: `By source · ${periodWord}`, body: `${cycleAligned ? gauge(`Against the $${APIFY_CYCLE_CAP} free-plan cap`, `${usd(total)} · ${Math.round(capPct)}%`, capPct, `Paid scrapes stop when the cap is reached, until the next cycle starts on the 16th.`) : ""}
        ${barList([
          { label: "Trustpilot", sub: plural(tp.requests, "scrape"), value: tp.cost, display: usd(tp.cost), c: "--c-reviews" },
          { label: "Google", sub: plural(gg.requests, "scrape"), value: gg.cost, display: usd(gg.cost), c: "--c-reviews" },
          { label: "Instagram profile", sub: plural(igProf.requests, "scrape"), value: igProf.cost, display: usd(igProf.cost), c: "--c-instagram" },
          { label: "Instagram posts", sub: plural(igPost.requests, "scrape"), value: igPost.cost, display: usd(igPost.cost), c: "--c-instagram" },
        ].sort((x, y) => y.value - x.value), { keepZero: true, empty: "Nothing spent " + periodWord + "." })}`,
        info: `<p>Reviews cost is Apify's exact <span class="mono">usageTotalUsd</span> per run. Instagram is items × unit price${ig ? ` (${usd(ig.unitPrice.profile)}/profile item, ${usd(ig.unitPrice.post)}/post item)` : ""}; both actors bill per dataset item.</p>` })}
    </div>
    ${card({ title: "Recent scrapes", sub: `last ${fmt(recent.length)}`, flush: true,
      info: "<p>* estimated from the per-item price. Only paid-plan review fetches hit Apify: free Trustpilot uses the self-hosted scraper and free Google uses the Places API (Google's $200/mo credit), both $0. Every Instagram scrape is paid.</p>",
      body: table({ rows: recent, noun: "scrapes", searchPh: "Search target…", search: (r) => r.source + " " + r.plugin + " " + SRC[r.kind], sort: { key: "when", dir: "desc" }, csv: "vanssay-apify-scrapes.csv",
        cols: [
          { key: "when", label: "When", v: (r) => dt(r.when), csv: (r) => r.when },
          { key: "plugin", label: "Plugin", v: (r) => `<span class="pc" style="--c:var(${r.plugin === "Reviews" ? "--c-reviews" : "--c-instagram"})"><i></i>${esc(r.plugin)}</span>` },
          { key: "kind", label: "Source", v: (r) => esc(SRC[r.kind] || r.kind) },
          { key: "source", label: "Target", v: (r) => (/^https?:\/\//.test(r.source) ? `<a class="wrapurl" href="${esc(r.source)}" target="_blank" rel="noopener">${esc(r.source.replace(/^https?:\/\/(www\.)?/, ""))}</a>` : esc(r.source || "–")) },
          { key: "items", label: "Items", r: true, v: (r) => fmt(r.items) },
          { key: "cost", label: "Cost", r: true, v: (r) => usd(r.cost) + (r.exact ? "" : "*") },
          { key: "status", label: "Status", v: (r) => (r.status === "SUCCEEDED" ? `<span class="bdg good">${icon("check")}ok</span>` : statusBadge(r.status)) },
        ] }) })}
    ${!ig ? `<p class="note" style="margin-top:10px">Instagram spend unavailable: ${esc(why(rs[1]) || "no data")}</p>` : ""}`);
}

const GEO_TABS = [["overview", "Overview"], ["sites", "Sites"], ["cache", "Cache"]];
async function geoPage(ctx, p, o) {

    const rs = await Promise.allSettled([acct("/overview", p.key), get(p.base + "/admin/overview"), get(p.base + "/admin/trend"),
      get(p.base + "/admin/countries" + (cm === "month" ? "?month=" + todayKey().slice(0, 7) : ""))]);

    paint(ctx, `${head()}
      ${kpis([...billingKpis(bill, p), ...(dom ? o.kpis(dom) : [])])}
      ${!bill && !dom ? card({ body: unavailable(p.label, rs[1]), cls: "mb" }) : ""}
      <div class="grid g21 mb">
        ${card({ title: o.trendTitle, sub: "last 12 months", body: trend ? chart({ keys: t.map((x) => x.month), gran: "month", height: 250, integer: true, series: o.series(t), total: o.total,
          extra: (i) => [["Visits checked", fmt(t[i].visits)], [o.rateLabel, pctOf(o.hits(t[i]), t[i].visits, 1)]], zero: "None", empty: o.emptyTrend }) : unavailable("Trend", rs[2]) })}
        ${card({ title: "Plan mix", body: planMix(bill, p) })}
      </div>
      ${card({ title: o.countryTitle, act: seg("countries", [["all", "All time"], ["month", "This month"]], cm), body: countries
        ? barList(countries.countries.map((c) => ({ label: country(c.countryCode), sub: `of ${fmt(c.visits)} visits`, value: o.hits(c), display: fmt(o.hits(c)) })).filter((r) => r.value > 0).sort((a, b) => b.value - a.value), { c: p.c, limit: 10, empty: o.emptyCountries })
        : unavailable("Countries", rs[3]) })}
      ${o.after ? o.after() : ""}`);
    onSeg(ctx.view, "countries", (v) => { setQuery({ countries: v === "month" ? "month" : null }); rerender(); });
    return;
  }
  if (tab === "sites") {
    const d = await get(p.base + "/admin/sites");
    if (!ctx.live()) return;
    paint(ctx, `${head()}${kpis(o.siteKpis(d.sites))}
      ${card({ flush: true, body: table({ rows: d.sites, noun: "sites", searchPh: "Search owner, site or label…", search: (s) => [s.email, s.domain, s.label].join(" "), sort: { key: "createdAt", dir: "desc" }, csv: p.route + "-sites.csv", empty: o.emptySites, cols: o.siteCols }) })}`);
    return;
  }
  if (tab === "cache") {
    const rs = await Promise.allSettled([get(p.base + "/admin/cache")]);
    if (!ctx.live()) return;
    paint(ctx, `${head()}<div class="grid g2">${cacheCard(val(rs[0]), rs[0], p, "IP geolocation cache")}</div>`);
    bindCache(ctx.view, p);
  }
}

/* ── Website traffic ───────────────────────────────────────────────────────────
   vanssay.net's own readers, from the beacon in assets/track.js. Owner visits
   are dropped at write time (browser opt-out flag + SITE_EXCLUDE_IPS), so what
   lands here is other people. "Visitors" are daily uniques summed over the
   range: the id is salted per day, so one person on three days counts three. */
async function pageWebsite(ctx) {
  const q = ctx.r.q;
  const days = ["7", "30", "90", "365"].includes(q.get("days")) ? q.get("days") : "30";
  const d = await get("/admin/site-traffic?days=" + days);
  if (!ctx.live()) return;
  const weekly = d.daily.length > 120;
  const rows = weekly
    ? rollup(d.daily, (x) => weekOf(x.day), (acc, x, k) => { acc = acc || { key: k, views: 0, visitors: 0, days: 0 }; acc.views += x.views; acc.visitors += x.visitors; acc.days++; return acc; })
    : d.daily.map((x) => ({ key: x.day, views: x.views, visitors: x.visitors, days: 1 }));
  const n = Number(days);
  const prevPerDay = d.previous.views / n;
  const best = d.daily.reduce((a, b) => (b.views > a.views ? b : a), { day: null, views: 0 });
  const totalRef = sum(d.referrers, (r) => r.views);
  const direct = (d.referrers.find((r) => r.host === "direct") || {}).views || 0;
  const topSource = d.referrers.find((r) => r.host !== "direct");
  const label = days === "365" ? "12 months" : days + " days";
  paint(ctx, `${pageHead({ title: "Website", sub: "Page views on vanssay.net, minus yours. No cookies, no third party: the counters live in our own database.",
      ctl: seg("days", [["7", "7 days"], ["30", "30 days"], ["90", "90 days"], ["365", "12 months"]], days) })}
    ${kpis([
      { label: "Page views · " + label, value: fmt(d.totals.views), hero: true, delta: delta(d.totals.views, d.previous.views), sub: d.previous.views ? `vs ${fmt(d.previous.views)} the ${label} before` : "first window with data" },
      { label: "Visitors", value: fmt(d.totals.visitors), delta: delta(d.totals.visitors, d.previous.visitors), sub: "daily uniques, summed", info: "<p>Counted once per day per person: the visitor id is salted with the day, so nobody is followed across days. One person reading on three days counts three times.</p>" },
      { label: "Busiest day", value: fmt(best.views), sub: best.day ? dueDate(best.day) : "–" },
      { label: "Top source", value: `<span style="font-size:19px">${esc(topSource ? topSource.host : "—")}</span>`, sub: `${topSource ? fmt(topSource.views) + " views · " : ""}${pctOf(direct, totalRef)} arrive direct` },
    ])}
    ${card({ title: weekly ? "Views per week" : "Views per day", cls: "mb",
      body: chart({ keys: rows.map((r) => r.key), gran: weekly ? "week" : "day", height: 260, integer: true, total: false,
        series: [{ id: "v", label: "Page views", c: "--c-accent", values: rows.map((r) => r.views) }, { id: "u", label: "Visitors", c: "--c-ink", type: "line", values: rows.map((r) => r.visitors) }],
        ref: d.previous.views ? { value: prevPerDay * (weekly ? 7 : 1), label: `previous ${label}: avg ${compact(prevPerDay * (weekly ? 7 : 1))}/${weekly ? "wk" : "day"}` } : null,
        zero: "No views", empty: "No page views recorded in this window." }) })}
    <div class="grid g2">
      ${card({ title: "Pages", sub: "by views", body: barList(d.pages.map((x) => ({ label: `<span class="mono" style="color:var(--text)">${esc(x.path)}</span>`, sub: plural(x.visitors, "visitor"), value: x.views, href: "https://vanssay.net" + x.path })), { c: "--c-accent", limit: 12, empty: "No page views recorded yet." }) })}
      ${card({ title: "Where they came from", body: barList(d.referrers.map((x) => ({ label: x.host === "direct" ? `<span class="muted">Direct / no referrer</span>` : esc(x.host), value: x.views })), { c: "--c-accent", limit: 12, empty: "No referrers recorded yet." }),
        info: `<p>Your own visits are excluded: signing into this admin flags the browser for good (add <span class="mono">?notrack=1</span> to any page to flag another one), and ${d.excludedIps ? plural(d.excludedIps, "IP") + (d.excludedIps > 1 ? " are" : " is") : "no IP is"} excluded server-side via <span class="mono">SITE_EXCLUDE_IPS</span>. Known bots are dropped too.</p>` })}
    </div>
    ${!d.excludedIps ? `<p class="note" style="margin-top:12px">${icon("info").replace("<svg", '<svg style="width:13px;height:13px;vertical-align:-2px;margin-right:4px"')}SITE_EXCLUDE_IPS is empty in prod: a cleared browser or your phone still counts as a visitor.</p>` : ""}`);
  onSeg(ctx.view, "days", (v) => { setQuery({ days: v === "30" ? null : v }); rerender(); });
}

/* ── Marketplace ranks ─────────────────────────────────────────────────────────
   Daily snapshots from framer-ranks.com (services/framerRanks.ts). Lower is
   better, so the axis is inverted: rank 1 sits at the top. Contexts are
   framer-ranks' own buckets; "category" resolves per plugin, since each sits
   in its own Framer Marketplace category. */
const RANK_CONTEXTS = [["global-paid", "Global · paid"], ["global-all", "Global · all"], ["category-paid", "Category · paid"], ["category-all", "Category · all"]];
function resolveRankContext(wanted, plugin, latest) {
  if (wanted === "global-paid" || wanted === "global-all") return wanted;
  const suffix = wanted === "category-paid" ? "-paid" : "-all";
  const own = latest.find((r) => r.plugin === plugin && r.context !== "global-paid" && r.context !== "global-all" && r.context.endsWith(suffix));
  return own ? own.context : wanted.replace("category", "global");
}
async function pageRanks(ctx) {
  const q = ctx.r.q;
  const days = ["30", "90", "365"].includes(q.get("days")) ? q.get("days") : "90";
  const rc = RANK_CONTEXTS.some(([k]) => k === q.get("ctx")) ? q.get("ctx") : "global-paid";
  const d = await get("/admin/plugin-ranks?days=" + days);
  if (!ctx.live()) return;
  const syncBtn = `<button class="btn sm" id="ranks-sync">${icon("refresh")}Fetch today's ranks</button>`;
  if (!d.latestDay) {
    paint(ctx, `${pageHead({ title: "Marketplace ranks", sub: "Daily position on the Framer Marketplace, per plugin. Lower is better.", ctl: syncBtn })}${card({ body: empty("No snapshot yet. Fetch today's ranks to start the timeline.", "medal") })}`);
  } else {
    const prods = PRODUCTS.filter((p) => d.series.some((r) => r.plugin === p.key));
    const allDays = [...new Set(d.series.map((r) => r.day))].sort();
    const series = prods.map((p) => {
      const ctxName = resolveRankContext(rc, p.key, d.latest);
      const m = new Map(d.series.filter((r) => r.plugin === p.key && r.context === ctxName).map((r) => [r.day, r.rank]));
      return { id: p.key, label: p.label, c: p.c, type: "line", values: allDays.map((k) => (m.has(k) ? m.get(k) : null)), ctxName };
    }).filter((s) => s.values.some((v) => v != null));
    const tiles = prods.map((p) => {
      const ctxName = resolveRankContext(rc, p.key, d.latest);
      const row = d.latest.find((r) => r.plugin === p.key && r.context === ctxName) || d.latest.find((r) => r.plugin === p.key);
      if (!row) return null;
      const hist = d.series.filter((r) => r.plugin === p.key && r.context === row.context).map((r) => r.rank);
      const bestRank = hist.length ? Math.min(...hist) : row.rank;
      const dl = row.delta || 0;
      const chip = dl === 0 ? `<span class="delta flat">same</span>` : `<span class="delta ${dl < 0 ? "good" : "bad"}">${icon(dl < 0 ? "up" : "dn")}${Math.abs(dl)}</span>`;
      return { label: p.label, c: p.c, value: "#" + fmt(row.rank), delta: chip, sub: `${esc(row.context)} · best #${fmt(bestRank)}`, spark: spark(hist.map((r) => -r).map((r, i, a) => r - Math.min(...a) + 1), { c: p.c }) };
    });
    paint(ctx, `${pageHead({ title: "Marketplace ranks", sub: "Daily position on the Framer Marketplace, per plugin. Lower is better. As of " + dueDate(d.latestDay) + ".",
        ctl: seg("days", [["30", "30 days"], ["90", "90 days"], ["365", "12 months"]], days) + syncBtn })}
      ${kpis(tiles)}
      ${card({ title: "Rank over time", act: seg("ctx", RANK_CONTEXTS, rc),
        info: "<p>“Category” is each plugin's own Framer Marketplace category (Reviews and Instagram: Integrations · Bouncer: Utilities · Router: Localization), so it is not the same category across plugins.</p><p>Source: framer-ranks.com, an independent, undocumented ranking site. A failed fetch skips that day; the line breaks there instead of inventing it.</p>",
        body: chart({ keys: allDays, gran: "day", height: 300, invert: true, series, endLabels: true, endText: (x, v) => `${x.label} #${v}`, zero: "No snapshot", empty: "No ranking data in this window." }) })}`);
    onSeg(ctx.view, "ctx", (v) => { setQuery({ ctx: v === "global-paid" ? null : v }); rerender(); });
  }
  onSeg(ctx.view, "days", (v) => { setQuery({ days: v === "90" ? null : v }); rerender(); });
  $("ranks-sync").onclick = (e) => act(e.currentTarget, async () => {
    try { await send("/admin/plugin-ranks/sync", "POST"); }
    catch (er) { if (!/already|exists/i.test(er.message)) throw er; } // today's row may already exist; re-read either way
    rerender();
  }, "Ranks fetched");
}

/* ── Compliance ────────────────────────────────────────────────────────────────
   The French filing calendar for the micro-entreprise. The page holds no
   schedule of its own: the backend computes every date from the rules and reads
   every euro out of the invoices table, so a deadline here cannot be stale and a
   turnover figure cannot disagree with the invoices behind it. Ticking a row is
   the only thing it writes, besides the logins kept for those portals. */
function dueTone(item, today) {
  if (item.done) return { tone: "", label: "Filed", sort: 3 };
  const d = dayDiff(item.due, today);
  if (d < 0) return { tone: "t-over", label: `${plural(-d, "day")} late`, sort: 0 };
  if (d === 0) return { tone: "t-over", label: "Today", sort: 0 };
  if (d <= 45) return { tone: "t-soon", label: `in ${plural(d, "day")}`, sort: 1 };
  return { tone: "t-far", label: `in ${plural(d, "day")}`, sort: 2 };
}
// The three sources of obligations flattened into one list of things to do.
function complianceItems(d) {
  const items = [];
  for (const p of d.urssaf.periods) items.push({
    key: p.key, group: "URSSAF", title: `URSSAF · declare turnover, ${p.label}`,
    detail: p.open ? `Period still running: ${eur(p.eurCents)} banked so far over ${plural(p.count, "invoice")}.`
      : `${eur(p.eurCents)} to declare over ${plural(p.count, "invoice")}.${p.first ? " Covers everything since the start of activity." : ""} Declare even if it is €0: a missing declaration is a penalty on its own.`,
    extra: p.missingEur ? `${plural(p.missingEur, "invoice")} carry no settled EUR figure: convert those by hand before declaring.` : "",
    due: p.due, dueApprox: false, link: d.links.urssaf, done: p.done, doneAt: p.doneAt,
  });
  for (const m of d.des.months) items.push({
    key: m.key, group: "DES", title: `DES · EU B2B services supplied in ${m.label}`,

    <div class="grid g2">
      ${card({ title: "Prod health", sub: "a Places search and a Stripe read", act: `<button class="btn sm primary" id="h-prod">${icon("zap")}Run</button>`, body: `<div id="h-prod-out" class="note">Not run yet.</div>` })}
      ${card({ title: "Trustpilot scraper", sub: "the free plan's only Trustpilot source", act: `<button class="btn sm primary" id="h-tp">${icon("zap")}Run</button>`,
        info: "<p>A live scrape through the self-hosted Playwright scraper, bypassing the cache. A healthy run takes a few seconds.</p>", body: `<div id="h-tp-out" class="note">Not run yet.</div>` })}
    </div>
    ${sec("Onboarding signals", { info: "<p>A handful of each is normal: connecting a business briefly produces both. A steady stream, or the same account appearing again and again, means people are looking at empty widgets.</p>" })}
    ${diag ? `${kpis([
        { label: "Empty widget reads · 24h", value: fmt(at("24h", "empty_cache_read")), sub: `${fmt(at("7d", "empty_cache_read"))} in 7d · ${fmt(at("30d", "empty_cache_read"))} in 30d` },
        { label: "Re-syncs throttled · 24h", value: fmt(at("24h", "refresh_throttled")), sub: `${fmt(at("7d", "refresh_throttled"))} in 7d · ${fmt(at("30d", "refresh_throttled"))} in 30d` },
      ])}
      <div class="grid g12">
        ${card({ title: "Accounts hit most", sub: "last 7 days", body: barList(diag.affected.map((a) => ({ label: esc(a.email), value: a.events })), { c: "--c-reviews", share: false, empty: "Nobody hit either signal in the last 7 days." }) })}
        ${card({ title: "Recent events", flush: true, body: table({ rows: diag.recent, noun: "events", page: 15, sort: { key: "createdAt", dir: "desc" }, searchPh: "Search account or source…", search: (r) => r.email + " " + (r.sourceId || ""),
          cols: [
            { key: "createdAt", label: "When", v: (r) => dt(r.createdAt) },
            { key: "kind", label: "Signal", v: (r) => `<span class="bdg ${r.kind === "empty_cache_read" ? "crit" : ""}">${esc(ISSUE_LABEL[r.kind] || r.kind)}</span>` },
            { key: "platform", label: "Platform" },
            { key: "email", label: "Account", v: (r) => esc(r.email) },
            { key: "sourceId", label: "Source", v: (r) => `<span class="mono wrapurl">${esc(r.sourceId || "–")}</span>` },
          ] }) })}
      </div>` : card({ body: unavailable("Signals", rs[1]) })}`);

  const run = (btnId, outId, path, render) => async () => {
    const btn = $(btnId), out = $(outId);
    btn.disabled = true; out.innerHTML = `<span class="muted">Running…</span>`;
    try { const d = await request(path); if ($(outId)) $(outId).innerHTML = render(d); }
    catch (e) { if ($(outId)) $(outId).innerHTML = `<div class="err-box">Failed: ${esc(e.message)}</div>`; }
    finally { if (btn.isConnected) btn.disabled = false; }
  };
  $("h-prod").onclick = run("h-prod", "h-prod-out", "/admin/health/prod", (d) =>
    `${alertBox(d.ok ? "ok" : "critical", d.ok ? "All checks passed" : "Something is failing", "Checked " + dt(d.checkedAt))}${d.checks.map(checkRow).join("")}`);
  $("h-tp").onclick = run("h-tp", "h-tp-out", "/admin/health/trustpilot", (d) =>
    `${alertBox(d.ok ? "ok" : "critical", d.ok ? `${fmt(d.reviews)} reviews scraped` : "Scrape failed", d.ok ? `${fmt(d.ms)}ms` : d.error || "failed")}
     ${d.ok ? kv("Business", esc(d.businessName || "–")) + kv("Rating", `${d.averageRating} ★ of ${fmt(d.totalCount)}`) + (d.sample ? kv("Newest review", `${esc(d.sample.authorName)} · ${d.sample.rating}★`) : "") : ""}
     <p class="note wrapurl" style="margin-top:8px">Target: ${esc(d.url || "")}</p>`);
  runPendingSystemCheck();

  const tick = async () => {
    if (LIVE.paused || !ctx.live()) return;
    try {
      const d = await request("/router/admin/diagnostics");
      if (!ctx.live() || LIVE.paused) return;
      sample(d);
      const el = $("live"); if (!el) return;
      el.innerHTML = routerLive(d); mount(el);
      $("live-at").textContent = "updated " + clock();
      const lv = d.warnings.some((x) => x.level === "critical") ? "critical" : d.warnings.length || d.checks.some((c) => !c.ok) ? "warning" : "";
      $("live-dot").className = "sdot " + lv;
    } catch (e) { if ($("live-at")) $("live-at").textContent = "update failed: " + e.message; }
  };
  every(15000, tick);
  $("live-toggle").onclick = () => {
    LIVE.paused = !LIVE.paused;
    $("live-toggle").innerHTML = icon(LIVE.paused ? "play" : "pause") + (LIVE.paused ? "Resume" : "Pause");
    if (!LIVE.paused) tick();
  };
}

/* ── Page registry, then go ── */
const PAGES = {
  home: { title: "Home", render: pageHome, skeleton: () => `<div class="page">${skel.head()}${skel.kpis(6)}<div class="grid g21">${skel.card()}${skel.card()}</div></div>` },
  users: { title: "Users", render: pageUsers },
  revenue: { title: "Revenue", render: pageRevenue },
  subscriptions: { title: "Subscriptions", render: pageSubscriptions },
  invoices: { title: "Invoices", render: pageInvoices },
  costs: { title: "Costs", render: pageCosts },
  reviews: { title: "Reviews", render: pageReviews, tabs: RV_TABS },
  instagram: { title: "Instagram", render: pageInstagram, tabs: IG_TABS },
  bouncer: { title: "Bouncer", render: pageBouncer, tabs: GEO_TABS },
  router: { title: "Router", render: pageRouter, tabs: GEO_TABS },
  "google-reviews-live": { title: "Google Reviews Live", render: pageComponent },
  website: { title: "Website", render: pageWebsite },
  ranks: { title: "Marketplace ranks", render: pageRanks },
  suggestions: { title: "Suggestions", render: pageSuggestions },
  compliance: { title: "Compliance", render: pageCompliance, tabs: CP_TABS },
  system: { title: "System", render: pageSystem },
};
boot();
</script>
