<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live demo | Instagram Feed for Framer</title>
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" href="/favicon-48.png" sizes="48x48" />
<link rel="apple-touch-icon" href="/favicon-180.png" />
<meta name="description" content="The Instagram Feed plugin's own live demo, running in your browser: a real @letypographe_be feed in all seven layouts — Profile, Grid, Slider, Aperture, Carousel, Marquee and Rainbow." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
/* ─────────────────────────────────────────────────────────────────────────
   This page is the plugin's own landing demo (the DemoExplorer that sits
   right under the handle field on the Connect screen), ported 1:1. The CSS
   is copied verbatim from Instagram_Feed_for_Framer/plugin/src/styles/*.css
   so it renders identically to the plugin. Keep them in sync.
   ───────────────────────────────────────────────────────────────────────── */
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-2: #f6f6f7;
  --surface-3: #eeeef1;
  --border: #e6e6e9;
  --border-strong: #d7d7dc;

  --text: #0d0d11;
  --text-secondary: #63636c;
  --text-muted: #9a9aa2;
  --text-on-ink: #ffffff;

  --ink: #101014;
  --ink-hover: #26262c;
  --ink-soft: #f1f1f3;

  --success: #158a52;
  --success-soft: #e8f7ef;

  --grad-1: #f6913d;
  --grad-2: #e0457b;
  --grad-3: #7452e0;
  --gradient: linear-gradient(135deg, var(--grad-1), var(--grad-2) 55%, var(--grad-3));

  --focus-ring: 0 0 0 3px rgba(16, 16, 20, 0.12);

  --body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 16px;
  --radius-full: 999px;

  --shadow-sm: 0 1px 2px rgba(15, 15, 20, 0.05);
  --shadow-md: 0 6px 20px rgba(15, 15, 20, 0.08);
  --shadow-lg: 0 20px 56px rgba(15, 15, 20, 0.18);

  --space-3xs: 2px; --space-2xs: 4px; --space-xs: 6px; --space-sm: 8px;
  --space-md: 12px; --space-lg: 16px; --space-xl: 24px; --space-2xl: 32px; --space-3xl: 48px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--body);
  font-size: 13px; line-height: 1.5; color: var(--text); background: var(--bg);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
#root { height: 100%; min-height: 100vh; display: flex; flex-direction: column; }
h1, h2, h3, h4, p { margin: 0; }
button, input { font-family: inherit; color: inherit; }
a { color: inherit; }
img { display: block; max-width: 100%; }
::selection { background: rgba(116, 82, 224, 0.22); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: var(--radius-full); border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: #b8b8c0; }
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
@keyframes riseIn { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
@keyframes marqueeScroll { from { transform: translateX(0) } to { transform: translateX(-50%) } }

/* ── App shell ─────────────────────────────────────────────────────────── */
.app { flex: 1; display: flex; flex-direction: column; background: var(--surface-2); min-height: 100vh; }
.connect-v2 { background: var(--bg); }
.connect-center {
  flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: stretch;
  padding: 0 0 var(--space-2xl); text-align: center; position: relative; justify-content: flex-start;
}

/* ── Buttons ───────────────────────────────────────────────────────────── */
.btn {
  appearance: none; border: 1px solid transparent; border-radius: var(--radius-sm);
  font-family: inherit; font-size: 13px; font-weight: 600; line-height: 1; padding: 11px 18px;
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-xs);
  transition: background .14s ease, border-color .14s ease, color .14s ease, transform .06s ease, box-shadow .14s ease;
  white-space: nowrap; text-decoration: none;
}
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.btn-primary { background: var(--ink); color: var(--text-on-ink); border-color: var(--ink); }
.btn-primary:hover:not(:disabled) { background: var(--ink-hover); }
.btn-outline { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.btn-outline:hover:not(:disabled) { background: var(--ink-soft); }
.btn-ghost { background: transparent; color: var(--text-secondary); border-color: transparent; }
.btn-ghost:hover:not(:disabled) { background: var(--ink-soft); color: var(--text); }
.btn-sm { padding: 7px 12px; font-size: 12px; }

/* ── Landing demo explorer ─────────────────────────────────────────────── */
.demo-explorer {
  width: 100%; max-width: 940px; margin: var(--space-2xl) auto 0; padding: 0 var(--space-lg);
  display: flex; flex-direction: column; gap: var(--space-md); text-align: left;
  animation: heroRise .62s cubic-bezier(.22, 1, .36, 1) both; animation-delay: .1s;
}
@keyframes heroRise { from { opacity: 0; transform: translateY(11px) } to { opacity: 1; transform: none } }
.demo-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-md); flex-wrap: wrap; }
.demo-tag { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); }
.demo-tabs {
  display: inline-flex; gap: 2px; padding: 3px; background: var(--surface-2);
  border: 1px solid var(--border); border-radius: var(--radius-full); flex-wrap: wrap;
}
.demo-tab {
  appearance: none; border: none; background: transparent; padding: 6px 12px; border-radius: var(--radius-full);
  font-size: 12px; font-weight: 700; color: var(--text-secondary); cursor: pointer;
  transition: background .14s ease, color .14s ease;
}
.demo-tab:hover { color: var(--text); }
.demo-tab:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.demo-tab[data-active="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
.demo-canvas { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); }

/* ── Preview stage ─────────────────────────────────────────────────────── */
.preview-stage { overflow: hidden; animation: stageIn .34s cubic-bezier(.22, 1, .36, 1); }
@keyframes stageIn { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }

/* Profile header */
.ig-profile-header { display: flex; gap: var(--space-xl); padding: var(--space-xl); align-items: center; }
.ig-profile-avatar { width: 86px; height: 86px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
.ig-profile-name-row { display: flex; align-items: center; gap: 6px; }
.ig-profile-name-row h3 { font-size: 16px; font-weight: 700; }
.ig-verified { color: #3897f0; flex-shrink: 0; display: flex; }
.ig-follow-btn {
  margin-left: var(--space-xs); padding: 5px 14px; border: none; border-radius: 8px; background: #0095f6;
  color: #fff; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; flex-shrink: 0; transition: background .15s ease;
}
.ig-follow-btn:hover { background: #1877f2; }
.ig-profile-stats { display: flex; gap: var(--space-lg); margin-top: var(--space-sm); font-size: 13px; }
.ig-profile-stats b { font-weight: 700; }
.ig-profile-stats span { color: var(--text-secondary); }
.ig-profile-bio { margin-top: var(--space-sm); font-size: 12.5px; color: var(--text); white-space: pre-line; max-width: 46ch; }
.ig-profile-bio .bio-name { font-weight: 700; }
.ig-profile-link { display: inline-flex; align-items: center; gap: 4px; margin-top: 2px; color: #3897f0; font-weight: 600; font-size: 12.5px; text-decoration: none; }
.ig-profile-link:hover { text-decoration: underline; }

/* Post tile */
.post-tile { position: relative; overflow: hidden; background: var(--surface-3); cursor: pointer; border: none; padding: 0; display: block; width: 100%; }
.post-tile img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .35s ease; }
/* Photos fade up rather than snapping in over the skeleton. */
.post-tile img[data-loaded="false"] { opacity: 0; }
.post-tile img[data-loaded="true"] { animation: mediaIn .32s ease both; }
@keyframes mediaIn { from { opacity: 0; transform: scale(1.012) } to { opacity: 1; transform: none } }
/* Loading placeholder — fills the tile's already-reserved footprint. */
.post-tile-skel {
  position: absolute; inset: 0;
  background: linear-gradient(90deg, #e9e9ee 25%, #f4f4f7 37%, #e9e9ee 63%);
  background-size: 400% 100%; animation: skelSweep 1.3s ease-in-out infinite;
}
@keyframes skelSweep { from { background-position: 100% 0 } to { background-position: 0 0 } }
.post-tile:hover img { transform: scale(1.035); }
.post-tile:focus-visible { outline: none; box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .7), var(--focus-ring); }
.post-tile-type-badge {
  position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; border-radius: 50%;
  background: rgba(13, 13, 17, .55); color: #fff; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(2px);
}
.post-tile-overlay {
  position: absolute; inset: 0; background: rgba(13, 13, 17, .38); opacity: 0; transition: opacity .18s ease;
  display: flex; align-items: center; justify-content: center; gap: var(--space-lg); color: #fff; font-weight: 700; font-size: 13.5px;
}
.post-tile:hover .post-tile-overlay { opacity: 1; }
.post-tile-overlay span { display: flex; align-items: center; gap: 5px; }

/* Grid layout */
.grid-layout { display: grid; gap: var(--gap, 4px); grid-template-columns: repeat(var(--cols, 3), 1fr); padding: var(--gap, 4px); }
.grid-layout .post-tile { aspect-ratio: 1; border-radius: var(--tile-radius, 4px); animation: tileIn .44s cubic-bezier(.22, 1, .36, 1) both; animation-delay: calc(var(--i, 0) * 26ms); }
@keyframes tileIn { from { opacity: 0; transform: translateY(9px) scale(.985) } to { opacity: 1; transform: none } }

/* Slider layout */
.slider-layout { padding: var(--space-xl); display: flex; flex-direction: column; align-items: center; gap: var(--space-md); }
.slider-stage { position: relative; width: 100%; max-width: 420px; aspect-ratio: 1; border-radius: var(--tile-radius, 12px); overflow: hidden; }
.slider-slide { width: 100%; height: 100%; animation: slideFade .34s cubic-bezier(.22, 1, .36, 1); }
.slider-stage .post-tile { height: 100%; }
@keyframes slideFade { from { opacity: 0; transform: scale(1.015) } to { opacity: 1; transform: none } }
.slider-nav { display: flex; align-items: center; gap: var(--space-lg); }
.slider-arrow {
  width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border-strong); background: var(--surface);
  display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); transition: background .14s ease;
}
.slider-arrow:hover { background: var(--ink-soft); }
.slider-dots { display: flex; align-items: center; gap: 5px; }
/* The active page stretches into a pill instead of just growing — reads as a
   position indicator rather than "one dot is bigger". */
.slider-dot {
  width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--border-strong);
  border: none; padding: 0; cursor: pointer;
  transition: width .28s cubic-bezier(.22, 1, .36, 1), background .2s ease;
}
.slider-dot[data-active="true"] { width: 18px; background: var(--ink); }

/* Coverflow carousel */
.cover-carousel { padding: var(--space-xl) var(--space-md); display: flex; align-items: center; justify-content: center; gap: var(--space-sm); }
.cover-stage {
  position: relative; flex: 1; height: 330px; overflow: hidden; perspective: 1200px;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 24%, #000 76%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 24%, #000 76%, transparent);
}
.cover-card {
  position: absolute; top: 50%; left: 50%; width: 232px; aspect-ratio: 4/5; margin: 0;
  border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-md);
  transition: transform .62s cubic-bezier(.22, 1, .36, 1), opacity .62s cubic-bezier(.22, 1, .36, 1), filter .62s cubic-bezier(.22, 1, .36, 1), box-shadow .62s ease;
  will-change: transform, opacity, filter; transform: translate(-50%, -50%);
}
.cover-card:not([data-off="0"]) { pointer-events: none; }
.cover-card[data-off="0"] { z-index: 5; transform: translate(-50%, -50%) scale(1); filter: none; }
.cover-card[data-off="-1"] { z-index: 4; transform: translate(-50%, -50%) translateX(-74%) scale(.8); filter: blur(2.5px) brightness(.92); opacity: .85; }
.cover-card[data-off="1"] { z-index: 4; transform: translate(-50%, -50%) translateX(74%) scale(.8); filter: blur(2.5px) brightness(.92); opacity: .85; }
.cover-card[data-off="-2"] { z-index: 3; transform: translate(-50%, -50%) translateX(-152%) scale(.6); filter: blur(7px) brightness(.9); opacity: .22; }
.cover-card[data-off="2"] { z-index: 3; transform: translate(-50%, -50%) translateX(152%) scale(.6); filter: blur(7px) brightness(.9); opacity: .22; }
.cover-card[data-off="-3"] { z-index: 2; transform: translate(-50%, -50%) translateX(-198%) scale(.52); filter: blur(8px); opacity: 0; }
.cover-card[data-off="3"] { z-index: 2; transform: translate(-50%, -50%) translateX(198%) scale(.52); filter: blur(8px); opacity: 0; }
.cover-arrow { position: relative; z-index: 6; flex-shrink: 0; }

/* Marquee layout */
.marquee-layout {
  padding: var(--space-xl) 0; overflow: hidden; position: relative;
  mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
}
.marquee-track { display: flex; gap: var(--space-md); width: max-content; animation: marqueeScroll 26s linear infinite; }
.marquee-layout:hover .marquee-track { animation-play-state: paused; }
.marquee-track .post-tile { width: 190px; aspect-ratio: 4/5; border-radius: var(--tile-radius, 10px); flex-shrink: 0; }

/* Aperture layout — closed slices are tall pills carrying their date turned on
   its side; the open one takes Instagram's own 4:5 while the rest retract to
   share what is left. Widths are set in JS: every slice is sized the SAME way,
   so one interpolating property carries the open instead of a layout-model jump. */
.aperture-layout { padding: var(--space-md); }
.aperture-row { display: flex; gap: 10px; height: 460px; padding: 14px; align-items: stretch; }
.aperture-slice {
  position: relative; flex: 0 0 auto; min-width: 0; overflow: hidden; cursor: pointer;
  background: #111; border: none; padding: 0; border-radius: 22px;
  transition: width .72s cubic-bezier(.22, 1, .36, 1), border-radius .72s cubic-bezier(.22, 1, .36, 1);
  /* Chrome does not clip a transformed child to the parent's radius cleanly —
     the #111 survives as dark specks in the corner antialiasing. */
  -webkit-mask-image: -webkit-radial-gradient(#fff, #000);
  mask-image: radial-gradient(#fff, #000);
}
.aperture-slice[data-on] { border-radius: 16px; }
.aperture-slice img {
  width: 100%; height: 100%; object-fit: cover; display: block;
  filter: saturate(.85) brightness(.62);
  transition: transform .9s cubic-bezier(.22, 1, .36, 1), filter .5s cubic-bezier(.22, 1, .36, 1);
}
/* Hovering a closed slice lifts it toward the open state — the affordance IS
   the preview. */
.aperture-slice:not([data-on]):hover img { filter: saturate(1) brightness(.92); }
.aperture-slice:not([data-on]):hover .aperture-date { color: #fff; letter-spacing: .2em; }
.aperture-slice[data-on] img { filter: none; transform: scale(1.02); }
/* The open slice is the only thing that can open further, so its hover is a
   slow push-in rather than a lift. */
.aperture-slice[data-on]:hover img { transform: scale(1.07); }
.aperture-date {
  position: absolute; inset: auto 0 0 0; padding: 14px 10px; display: flex; justify-content: center;
  writing-mode: vertical-rl; transform: rotate(180deg);
  font-size: 11px; font-weight: 800; letter-spacing: .16em; color: rgba(255, 255, 255, .9);
  text-shadow: 0 1px 10px rgba(0, 0, 0, .7);
  transition: opacity .3s cubic-bezier(.22, 1, .36, 1), color .3s cubic-bezier(.22, 1, .36, 1), letter-spacing .45s cubic-bezier(.22, 1, .36, 1);
}
.aperture-slice[data-on] .aperture-date { opacity: 0; }
/* The caption and the like count exist only in the open state, so the layout
   uses data a grid throws away. */
.aperture-cap {
  position: absolute; inset: auto 0 0 0; padding: 22px; opacity: 0; transform: translateY(10px);
  background: linear-gradient(transparent, rgba(6, 5, 10, .9));
  transition: opacity .5s cubic-bezier(.22, 1, .36, 1) .12s, transform .5s cubic-bezier(.22, 1, .36, 1) .12s, padding .5s cubic-bezier(.22, 1, .36, 1);
}
.aperture-slice[data-on] .aperture-cap { opacity: 1; transform: none; }
.aperture-slice[data-on]:hover .aperture-cap { padding-bottom: 26px; }
.aperture-cap p {
  margin: 0; color: #fff; font-size: 13.5px; font-weight: 600; line-height: 1.45; max-width: 44ch;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
/* Clamped at rest; hovering gives it the room to finish. */
.aperture-slice[data-on]:hover .aperture-cap p { -webkit-line-clamp: 4; }
.aperture-meta {
  display: flex; align-items: center; gap: 14px; margin-top: 9px;
  color: rgba(255, 255, 255, .82); font-size: 12px; font-weight: 700;
}
.aperture-meta span { display: flex; align-items: center; gap: 5px; }
.aperture-go {
  margin-left: auto; padding: 5px 11px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .35);
  color: #fff; font-size: 11px; font-weight: 700; opacity: 0; transform: translateY(4px);
  transition: opacity .34s cubic-bezier(.22, 1, .36, 1), transform .34s cubic-bezier(.22, 1, .36, 1), background .2s ease;
}
.aperture-slice[data-on]:hover .aperture-go { opacity: 1; transform: none; }
.aperture-go:hover { background: rgba(255, 255, 255, .16); }
@media (max-width: 720px) {
  /* A row of 4:5 slices is unreadable on a phone — stack them as full-width
     cards with their captions already on, and nothing to open. */
  .aperture-row { flex-direction: column; height: auto; gap: 8px; padding: 8px; }
  .aperture-slice { width: auto !important; aspect-ratio: 4/5; border-radius: 16px; }
  .aperture-slice img { filter: none; }
  .aperture-date { opacity: 0; }
  .aperture-cap { opacity: 1; transform: none; }
}

/* Rainbow layout */
.rainbow-layout { padding: var(--space-2xl) var(--space-xl); display: flex; align-items: center; justify-content: center; gap: var(--space-md); }
.rainbow-stage {
  position: relative; height: 360px; overflow: hidden;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
  width: 100%; max-width: 640px; display: flex; align-items: center; justify-content: center;
}
.rainbow-card {
  position: absolute; width: 220px; aspect-ratio: 4/5; border-radius: 14px; overflow: hidden; box-shadow: var(--shadow-md);
  transition: transform .62s cubic-bezier(.22, 1, .36, 1), opacity .62s cubic-bezier(.22, 1, .36, 1), filter .62s cubic-bezier(.22, 1, .36, 1);
  will-change: transform, opacity, filter; border: 4px solid var(--surface);
}
.rainbow-card[data-off="0"] { z-index: 4; transform: translateX(0) rotate(0deg) scale(1); }
.rainbow-card[data-off="-1"] { z-index: 3; transform: translateX(-150px) rotate(-9deg) scale(.94); filter: brightness(.94); }
.rainbow-card[data-off="1"] { z-index: 3; transform: translateX(150px) rotate(9deg) scale(.94); filter: brightness(.94); }
.rainbow-card[data-off="-2"] { z-index: 2; transform: translateX(-260px) rotate(-16deg) scale(.86); filter: brightness(.88); opacity: .7; }
.rainbow-card[data-off="2"] { z-index: 2; transform: translateX(260px) rotate(16deg) scale(.86); filter: brightness(.88); opacity: .7; }
.rainbow-card[data-off="-3"] { z-index: 1; transform: translateX(-345px) rotate(-22deg) scale(.78); filter: brightness(.82); opacity: 0; }
.rainbow-card[data-off="3"] { z-index: 1; transform: translateX(345px) rotate(22deg) scale(.78); filter: brightness(.82); opacity: 0; }
.rainbow-arrow { position: relative; z-index: 4; }
/* The chip belongs to the centre slot, not to a card: cards keep their post as
   the deck turns, so fade it with the same curve rather than re-rendering. */
.rainbow-card .stat-chip { opacity: 0; transition: opacity .42s cubic-bezier(.22, 1, .36, 1); }
.rainbow-card[data-off="0"] .stat-chip { opacity: 1; }

/* Stat chip */
.stat-chip {
  position: absolute; bottom: 8px; left: 8px; display: flex; gap: 8px; background: rgba(13, 13, 17, .55);
  color: #fff; font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: var(--radius-full); backdrop-filter: blur(2px);
}
.stat-chip span { display: flex; align-items: center; gap: 3px; }

/* ── Lightbox ──────────────────────────────────────────────────────────── */
.lightbox-backdrop {
  position: fixed; inset: 0; background: rgba(10, 10, 13, .6); backdrop-filter: blur(2px);
  display: flex; align-items: center; justify-content: center; padding: var(--space-xl); z-index: 50; animation: fadeIn .15s ease;
}
.lightbox {
  background: var(--surface); border-radius: var(--radius-lg); overflow: hidden; display: flex;
  width: min(880px, 100%);
  /* FIXED height, not max-height: the modal must not resize when the photo
     decodes (see the plugin's own note). */
  height: min(680px, 90vh);
  box-shadow: var(--shadow-lg); animation: riseIn .18s ease;
}
.lightbox-media { flex: 1.15; background: #000; display: flex; align-items: center; justify-content: center; position: relative; min-width: 0; min-height: 0; }
.lightbox-media img { width: 100%; height: 100%; object-fit: contain; }
.lightbox-media img[data-loaded="false"] { opacity: 0; }
.lightbox-media img[data-loaded="true"] { animation: mediaIn .32s ease both; }
/* Dark shimmer — the light tile one would flash white against the black stage. */
.lightbox-skel {
  position: absolute; inset: 0;
  background: linear-gradient(90deg, #1a1a1f 25%, #2a2a32 37%, #1a1a1f 63%);

const trim1 = (x) => (Math.round(x * 10) / 10).toString();
function compact(n) {
  if (n < 1000) return String(n);
  if (n < 1e6) { const k = n / 1000; return (k >= 100 ? Math.round(k) : trim1(k)) + "K"; }
  const m = n / 1e6;
  return (m >= 100 ? Math.round(m) : trim1(m)) + "M";
}
/* Short rail date ("MAR 14"): the long form is unreadable turned on its side in
   a 46px pill. */
function shortDate(iso) {
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }).toUpperCase();
}
function formatDate(iso) {
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  return d.toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" }).toUpperCase();
}

/* ── components/PostTile.tsx ───────────────────────────────────────────────
   The skeleton fills the tile's reserved footprint and the photo fades up over
   it; `onload`/`onerror` both clear it, so a broken image can't shimmer forever. */
function postTile(post, opts = {}) {
  const { showStats = true, chip = false, style = "" } = opts;
  const badge =
    post.type === "video" ? `<span class="post-tile-type-badge">${IconPlay(12)}</span>`
    : post.type === "carousel" ? `<span class="post-tile-type-badge">${IconStack(12)}</span>` : "";
  const overlay = showStats
    ? `<span class="post-tile-overlay"><span>${IconHeart(15)} ${compact(post.likes)}</span><span>${IconComment(15)} ${compact(post.comments)}</span></span>`
    : "";
  const chipEl = chip
    ? `<span class="stat-chip"><span>${IconHeart(11)} ${compact(post.likes)}</span><span>${IconComment(11)} ${compact(post.comments)}</span></span>`
    : "";
  return `<button type="button" class="post-tile" data-post="${post.id}" style="${style}"
    aria-label="Open post: ${esc(post.caption.slice(0, 60))}">
    <span class="post-tile-skel" aria-hidden></span>
    <img src="${post.mediaUrl}" alt="${esc(post.caption || "Instagram post")}" loading="lazy" draggable="false"
      data-loaded="false" onload="tileLoaded(this)" onerror="tileLoaded(this)" />
    ${badge}${overlay}${chipEl}</button>`;
}
function tileLoaded(img) {
  img.dataset.loaded = "true";
  const skel = img.parentElement.querySelector(".post-tile-skel");
  if (skel) skel.remove();
}

   and change only its data-off — that attribute swap is what the CSS
   transition interpolates. Re-rendering the cards (or swapping their images
   in place) leaves nothing to animate, which is why the deck snapped. */
function cardHtml(kind, key, o) {
  const post = POSTS[mod(key, POSTS.length)];
  const inner = kind === "cover"
    ? postTile(post, { style: "--tile-radius:10px;width:100%;height:100%" })
    : postTile(post, { showStats: false, chip: true, style: "width:100%;height:100%" });
  return `<div class="${kind}-card" data-off="${o}" data-key="${key}">${inner}</div>`;
}
function deckCards(kind) {
  const span = Math.min(3, Math.max(0, POSTS.length - 1));
  const i = state[kind], out = [];
  for (let o = -span; o <= span; o++) out.push(cardHtml(kind, i + o, o));
  return out.join("");
}

function coverLayout() {
  const cards = deckCards("cover");
  return `<div class="cover-carousel">
    <button class="slider-arrow cover-arrow" data-cover-go="-1" aria-label="Previous post" type="button">${IconLeft(18)}</button>
    <div class="cover-stage">${cards}</div>
    <button class="slider-arrow cover-arrow" data-cover-go="1" aria-label="Next post" type="button">${IconRight(18)}</button>
  </div>`;
}

function marqueeLayout() {
  const loop = POSTS.concat(POSTS);
  return `<div class="marquee-layout"><div class="marquee-track">${loop
    .map((p) => postTile(p, { showStats: false, style: "--tile-radius:10px" }))
    .join("")}</div></div>`;
}

/* Aperture. Six slices; only one is open. Opening is a WIDTH change on nodes
   that already exist — so unlike every other layout here it must never repaint
   the canvas, or there is nothing left for the transition to interpolate. */
function apertureLayout() {
  const slices = POSTS.slice(0, 6)
    .map(
      (p, i) => `<button type="button" class="aperture-slice"${i === state.aperture ? " data-on" : ""} data-aperture="${i}" data-post="${p.id}"
        aria-label="${i === state.aperture ? "Open post" : `Show post from ${shortDate(p.timestamp)}`}">
        <img src="${p.mediaUrl}" alt="${esc(p.caption || "Instagram post")}" loading="lazy" draggable="false">
        <span class="aperture-date">${shortDate(p.timestamp)}</span>
        <div class="aperture-cap">
          <p>${esc(p.caption) || "&nbsp;"}</p>
          <div class="aperture-meta">
            <span>${IconHeart(13)} ${compact(p.likes)}</span>
            <span>${IconComment(13)} ${compact(p.comments)}</span>
            <span class="aperture-go">View post</span>
          </div>
        </div>
      </button>`,
    )
    .join("");
  return `<div class="aperture-layout"><div class="aperture-row" id="ap-row">${slices}</div></div>`;
}

/* Widths, computed from the room the row actually has. The open slice is the
   post's own 4:5 taken from the row height, capped so it can never eat the row
   and leave the closed pills at zero. A hovered closed slice takes LIFT shares
   of what is left and the others one each, so the row's total width never
   changes and nothing outside it reflows. */
const AP = { GAP: 10, PAD: 14, LIFT: 1.45, hovered: -1 };
function apertureSize() {
  const row = document.getElementById("ap-row");
  if (!row) return;
  const slices = [...row.querySelectorAll(".aperture-slice")];
  const n = slices.length;
  if (!n) return;
  // Stacked on a phone: the CSS owns the sizing there, so clear the inline widths.
  if (window.matchMedia("(max-width: 720px)").matches) {
    slices.forEach((el) => { el.style.width = ""; });
    return;
  }
  const inner = row.clientWidth - AP.PAD * 2;
  const h = row.clientHeight - AP.PAD * 2;
  const open = Math.min(h * 0.8, inner - (n - 1) * (AP.GAP + 46));
  const room = inner - open - AP.GAP * (n - 1);
  const lifting = AP.hovered >= 0 && AP.hovered !== state.aperture;
  const unit = n > 1 ? room / (lifting ? n - 2 + AP.LIFT : n - 1) : 0;
  slices.forEach((el, i) => {
    const w = i === state.aperture ? open : lifting && i === AP.hovered ? unit * AP.LIFT : unit;
    el.style.width = Math.max(0, w) + "px";
  });
}

function rainbowLayout() {
  const cards = deckCards("rainbow");
  return `<div class="rainbow-layout">
    <button class="slider-arrow rainbow-arrow" data-rainbow-go="-1" aria-label="Previous" type="button">${IconLeft(18)}</button>
    <div class="rainbow-stage">${cards}</div>
    <button class="slider-arrow rainbow-arrow" data-rainbow-go="1" aria-label="Next" type="button">${IconRight(18)}</button>
  </div>`;
}

function renderLayout(layout) {
  switch (layout) {
    case "profile": return profileHeader(PROFILE) + gridLayout();
    case "grid": return gridLayout();
    case "slider": return sliderLayout();
    case "aperture": return apertureLayout();
    case "carousel": return coverLayout();
    case "marquee": return marqueeLayout();
    case "rainbow": return rainbowLayout();
  }
}

const canvas = document.getElementById("canvas");
function paint(animate = true) {
  canvas.innerHTML = `<div class="preview-stage"${animate ? "" : ' style="animation:none"'}>${renderLayout(state.layout)}</div>`;
  AP.hovered = -1;
  apertureSize();
}

// The row is width-driven, so it has to be re-measured whenever the page is.
window.addEventListener("resize", apertureSize);

/* Hover changes only the widths — no repaint, or the lift would not animate. */
canvas.addEventListener("mouseover", (e) => {
  const sl = e.target.closest(".aperture-slice");
  const i = sl ? Number(sl.dataset.aperture) : -1;
  if (i === AP.hovered) return;
  AP.hovered = i;
  apertureSize();
});
canvas.addEventListener("mouseleave", () => {
  if (AP.hovered === -1) return;
  AP.hovered = -1;
  apertureSize();
});

/* One step of the deck. Keys [i-span, i+span] shift by one: the outermost card
   leaves, a new one mounts on the far side at opacity 0 (the off-stage ring it
   fades in from), and everything in between just moves inward or outward. */
function advance(kind, d) {
  const stage = canvas.querySelector(kind === "cover" ? ".cover-stage" : ".rainbow-stage");
  if (!stage) return;
  const span = Math.min(3, Math.max(0, POSTS.length - 1));
  const i = (state[kind] += d);
  stage.querySelectorAll("[data-key]").forEach((el) => {
    const off = Number(el.dataset.key) - i;
    if (Math.abs(off) > span) el.remove();
    else el.dataset.off = off;
  });
  stage.insertAdjacentHTML("beforeend", cardHtml(kind, i + d * span, d * span));
}

/* ── Tabs (components/DemoExplorer.tsx) ────────────────────────────────── */
document.getElementById("tabs").innerHTML = ORDER.map(
  (l) => `<button type="button" role="tab" class="demo-tab" data-layout="${l}" data-active="${l === state.layout}" aria-selected="${l === state.layout}">${LABEL[l]}</button>`,
).join("");

/* ── components/Lightbox.tsx ───────────────────────────────────────────── */
const lbRoot = document.getElementById("lightbox-root");
const lb = { open: false, idx: 0, slide: 0 };

function lbLoaded(img) {
  img.dataset.loaded = "true";
  const skel = img.parentElement.querySelector(".lightbox-skel");
  if (skel) skel.remove();
}

function paintLightbox() {
  if (!lb.open) { lbRoot.innerHTML = ""; return; }
  const post = POSTS[lb.idx];
  const many = POSTS.length > 1;
  const slides = post.type === "carousel" && post.carousel ? post.carousel : null;
  const media = slides ? slides[lb.slide] : { mediaUrl: post.mediaUrl };

  const carouselNav = slides && slides.length > 1
    ? `${lb.slide > 0 ? `<button class="lightbox-carousel-nav prev" data-slide="-1" aria-label="Previous image" type="button">${IconLeft(18)}</button>` : ""}
       ${lb.slide < slides.length - 1 ? `<button class="lightbox-carousel-nav next" data-slide="1" aria-label="Next image" type="button">${IconRight(18)}</button>` : ""}
       <div class="lightbox-carousel-dots" aria-hidden>${slides.map((_, i) => `<span data-active="${i === lb.slide}"></span>`).join("")}</div>`
    : "";

  lbRoot.innerHTML = `<div class="lightbox-backdrop" role="dialog" aria-modal="true" aria-label="Post detail">
    ${many ? `<button class="lightbox-post-nav prev" data-post-go="-1" aria-label="Previous post" type="button">${IconLeft(22)}</button>` : ""}
    <div class="lightbox">
      <div class="lightbox-media">
        <button class="lightbox-close" aria-label="Close" type="button">${IconClose(16)}</button>
        <div class="lightbox-media-frame">
          <span class="lightbox-skel" aria-hidden></span>
          <img src="${media.mediaUrl}" alt="${esc(post.caption || "Instagram post")}" data-loaded="false"
            onload="lbLoaded(this)" onerror="lbLoaded(this)" />
        </div>
        ${carouselNav}
      </div>
      <div class="lightbox-side">
        <div class="lightbox-side-head">
          <img src="${PROFILE.avatarUrl}" alt="" />
          <strong>${PROFILE.handle}</strong>
          ${many ? `<span class="lightbox-counter">${lb.idx + 1} / ${POSTS.length}</span>` : ""}
        </div>
        <div class="lightbox-caption">${esc(post.caption)}</div>
        <div class="lightbox-meta">
          <div class="lightbox-stats">
            <span>${IconHeart(15)} ${compact(post.likes)}</span>
            <span>${IconComment(15)} ${compact(post.comments)}</span>
          </div>
          <div class="lightbox-date">${formatDate(post.timestamp)}</div>
          <a class="btn btn-outline btn-sm" href="${post.permalink}" target="_blank" rel="noopener">${IconExternal(14)} View on Instagram</a>
        </div>
      </div>
    </div>
    ${many ? `<button class="lightbox-post-nav next" data-post-go="1" aria-label="Next post" type="button">${IconRight(22)}</button>` : ""}
  </div>`;
}

/* ── Events ────────────────────────────────────────────────────────────── */
document.addEventListener("click", (e) => {
  // Lightbox controls first — a tile inside the modal must not reopen it.
  if (lb.open) {
    const pGo = e.target.closest("[data-post-go]");
    if (pGo) { lb.slide = 0; lb.idx = (lb.idx + Number(pGo.dataset.postGo) + POSTS.length) % POSTS.length; paintLightbox(); return; }
    const sl = e.target.closest("[data-slide]");
    if (sl) { lb.slide += Number(sl.dataset.slide); paintLightbox(); return; }
    // Close on the X, or on any backdrop click outside the modal card.
    if (e.target.closest(".lightbox-close") || !e.target.closest(".lightbox")) {
      lb.open = false; paintLightbox();
    }
    return;
  }

  const tab = e.target.closest("[data-layout]");
  if (tab) {
    state.layout = tab.dataset.layout;
    document.querySelectorAll("[data-layout]").forEach((b) => {
      const on = b.dataset.layout === state.layout;
      b.dataset.active = on; b.setAttribute("aria-selected", on);
    });
    paint();
    return;
  }

  const sGo = e.target.closest("[data-slider-go]");
  if (sGo) { state.slider = (state.slider + Number(sGo.dataset.sliderGo) + POSTS.length) % POSTS.length; paint(false); return; }
  const sDot = e.target.closest("[data-slider-dot]");
  if (sDot) { state.slider = Number(sDot.dataset.sliderDot); paint(false); return; }

  const cGo = e.target.closest("[data-cover-go]");
  if (cGo) { advance("cover", Number(cGo.dataset.coverGo)); return; }

  const ap = e.target.closest("[data-aperture]");
  if (ap && canvas.contains(ap)) {
    const i = Number(ap.dataset.aperture);
    if (i !== state.aperture) {
      // Attribute swap + re-measure, never a repaint: the width transition is
      // the whole layout.
      state.aperture = i;
      canvas.querySelectorAll(".aperture-slice").forEach((el) => {
        el.toggleAttribute("data-on", Number(el.dataset.aperture) === i);
      });
      apertureSize();
      return;
    }
    // Clicking the OPEN slice is the same gesture as clicking any other post.
    const k = POSTS.findIndex((p) => p.id === ap.dataset.post);
    if (k >= 0) { lb.open = true; lb.idx = k; lb.slide = 0; paintLightbox(); }
    return;
  }

  const rGo = e.target.closest("[data-rainbow-go]");
  if (rGo) { advance("rainbow", Number(rGo.dataset.rainbowGo)); return; }

  const tile = e.target.closest(".post-tile");
  if (tile && canvas.contains(tile)) {
    const i = POSTS.findIndex((p) => p.id === tile.dataset.post);
    if (i >= 0) { lb.open = true; lb.idx = i; lb.slide = 0; paintLightbox(); }
  }
});

document.addEventListener("keydown", (e) => {
  if (!lb.open) return;
  if (e.key === "Escape") { lb.open = false; paintLightbox(); }
  if (e.key === "ArrowLeft") { lb.slide = 0; lb.idx = (lb.idx - 1 + POSTS.length) % POSTS.length; paintLightbox(); }
  if (e.key === "ArrowRight") { lb.slide = 0; lb.idx = (lb.idx + 1) % POSTS.length; paintLightbox(); }
});

// Deep link: instagram-preview#grid opens straight onto a layout.
const wanted = location.hash.slice(1);
if (ORDER.includes(wanted)) {
  state.layout = wanted;
  document.querySelectorAll("[data-layout]").forEach((b) => {
    const on = b.dataset.layout === wanted;
    b.dataset.active = on; b.setAttribute("aria-selected", on);
  });
}
paint();
</script>
</body>
</html>
